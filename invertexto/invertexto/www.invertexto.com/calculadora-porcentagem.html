<script>
function run(){

	$('#calcular1').click(function(){
		var v1 = $('#c1v1').val();
		var v2 = $('#c1v2').val();
		var result = (v1 * v2) / 100;
		$('#r1').text(result.toLocaleString());
	});

	$('#calcular2').click(function(){
		var v1 = $('#c2v1').val();
		var v2 = $('#c2v2').val();
		var result = (v1 / v2) * 100;
		$('#r2').text(result.toLocaleString()+'%');
	});

	$('#calcular3').click(function(){
		var v1 = $('#c3v1').val();
		var v2 = $('#c3v2').val();
		var result = ((v2-v1)/v1) * 100;
		$('#r3').text(result.toLocaleString()+'%');
	});

	$('#calcular4').click(function(){
		var v = $('#c4v1').val();
		var p = $('#c4v2').val();
		var result = parseFloat(v) + parseFloat(v * (p/100));
		$('#r4').text(result.toLocaleString());
	});

	$('#calcular5').click(function(){
		var v = $('#c5v1').val();
		var p = $('#c5v2').val();
		var result = parseFloat(v) - parseFloat(v * (p/100));
		$('#r5').text(result.toLocaleString());
	});
}
</script>	</main>
