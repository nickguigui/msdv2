<script>
function run(){
	$('#calcular').click(function() {

		var dia = $('#dia').val();
		var mes = $('#mes').val();
		var ano = $('#ano').val();
		var ciclo = $('#ciclo').val();

		$(document).ajaxStart(function(){
			$("#calcular").attr('disabled', true);
		});
	
		$(document).ajaxStop(function(){
			$("#calcular").removeAttr('disabled');
		});

		$.ajax({
			method: "POST",
			url: "ajax/calcular-periodo-fertil.php",
			dataType: "json",
			data: {dia:dia,mes:mes,ano:ano,ciclo:ciclo}

		}).done(function(json) {
			if(json.status=='OK'){

				var row = '';

				for(var i=0; i < json.days.length; i++) {
					var obj = json.days[i];
					row += '<li class="day-block '+obj.type+'">'+obj.date+'</li>';
				}

				$('.result ul').html(row);
				$('.result').show();

			}else{
				alert(json.status);
			}
		});
	});
}
