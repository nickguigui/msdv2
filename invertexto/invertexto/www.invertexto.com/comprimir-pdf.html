<script>
function run(){

	var thumbId=0;

	function formatBytes(bytes) {
		if (bytes === 0) return '0 Bytes';
		const k = 1000;
		const sizes = ['Bytes', 'KB', 'MB'];
		const i = Math.floor(Math.log(bytes) / Math.log(k));
		return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
	}

	function generateThumbnail(url, id){

		pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';

		pdfjsLib.getDocument(url).then(function getPdfHelloWorld(pdf) {

			pdf.getPage(1).then(function getPageHelloWorld(page) {
				var vp = page.getViewport(1);
				var canvas = document.getElementById(id);
				canvas.width = 149;
				canvas.height = 212;
				var scale = Math.max(canvas.width / vp.width, canvas.height / vp.height);
				var viewport = page.getViewport(scale);

				var context = canvas.getContext('2d');

				var renderContext = {
					canvasContext: context,
					viewport: viewport
				};
				page.render(renderContext);
			});
		});
	}

	var hasError = false;
	var hasUploadError = false;
	var files = [];

	Dropzone.autoDiscover = false;
	var myDropzone = new Dropzone('#previews', {
		autoProcessQueue: true,
		uploadMultiple: false,
		parallelUploads: 20,
		maxFiles: 20,
		paramName: "file",
		maxFilesize: 16,
		addRemoveLinks: false,
		clickable: true,
		timeout: 3600000,
		acceptedFiles: '.pdf',
		previewTemplate: '<div class="file" ><div data-dz-remove class="remove glyphicon glyphicon-remove" title="Remover"></div><canvas id="" width="149" height="212" data-dz-thumbnail></canvas><div class="file-info" data-dz-name></div></div>',
		dictDefaultMessage: '<i class="glyphicon glyphicon-download-alt drop"></i><p>Arraste os arquivos ou clique aqui.</p>',
		dictInvalidFileType: 'Tipo de arquivo não permitido.',
		dictMaxFilesExceeded: 'Limitado a 20 arquivos.',
		dictFileTooBig: 'Limitado a 16MB por arquivo.',
		init: function() {

			var porcentagem=0;

			this.on("sending", function(file) {
				$('#processar').text('Enviando...');
				$('#processar').attr('disabled', true);
			});

			this.on("addedfile", function(file) {

				$('.controll-bar').show();

				file.previewTemplate.setAttribute('data-name',file.name);
				file.previewTemplate.childNodes[1].id = thumbId;
				thumbId++;

				var reader = new FileReader();
				reader.onload = function(event) {
					if(!file.accepted) return;
					var canvasId = file.previewTemplate.childNodes[1].id;
					generateThumbnail(event.target.result, canvasId);
				};
				reader.readAsDataURL(file);
			});

			this.on("removedfile", function(file) {
				files = this.getAcceptedFiles();
				if(files.length==0){
					$('.controll-bar').hide();
					$('#result').hide();
				}
			});

			this.on("totaluploadprogress", function(uploadProgress, totalBytes, totalBytesSent) {
				if(porcentagem>uploadProgress) return;
				if(totalBytesSent==0) return;

				porcentagem = Math.floor(uploadProgress);
				$('.progress-bar').show();
				$('.progress-bar').css('width', porcentagem+'%');
				$('.progress-bar').attr('aria-valuenow', porcentagem);
			});

			this.on("success", function(file, response) {
				if(response!='OK'){
					if(!hasUploadError) alert(response);

					this.removeFile(file);
					hasUploadError = true;
					location.reload();
				}
			});

			this.on("queuecomplete", function() {
				files = this.getAcceptedFiles();
				$('#processar').text('Comprimir');
				$('#processar').removeAttr('disabled');
				$('.progress-bar').hide();
				$('.progress-bar').css('width', '0%');
				$('.progress-bar').attr('aria-valuenow', 0);
			});

			this.on("complete", function(file) {
				files = this.getAcceptedFiles();
			});

			this.on("error", function(file, errorMessage) {
				if(errorMessage!='0'){
					this.removeFile(file);
					alert(errorMessage);
					hasError = true;
					return;
				}
				hasError = false;
			});
  		}
	});

	$('#processar').click(function(){
		
		var quality = $('#quality').val();
		
		if(files.length==0){
			alert('Nenhum arquivo enviado.');
			return;
		}

		var fileNames = [];
		files.forEach(function(file){
			if(file.status=='success'){
				fileNames.push(file.name);
			}
		});

		if(fileNames.length==0){
			alert('Nenhum arquivo válido para comprimir.');
			return;
		}

		var data = {
			quality: quality,
			files: JSON.stringify(fileNames)
		};

		$.ajax({type:'post', data:data, url:'comprimir-pdf-process.php', dataType:'json',
			beforeSend: function(){
				$('#processar').text('Carregando...');
				$('#processar').attr('disabled', true);
			},
			success: function(j){
				if(j.status=='OK'){
					// Calcular totais
					var totalOriginal = 0;
					var totalCompressed = 0;
					j.stats.forEach(function(stat){
						totalOriginal += stat.originalSize;
						totalCompressed += stat.compressedSize;
					});
					var totalReduction = totalOriginal > 0 ? ((totalOriginal - totalCompressed) / totalOriginal * 100).toFixed(1) : 0;
					var totalSaved = totalOriginal - totalCompressed;
					
					var html = '<div class="summary-header">';
					html += '<h3>'+j.stats.length+' '+(j.stats.length > 1 ? 'arquivos comprimidos' : 'arquivo comprimido')+'</h3>';
					html += '<div class="summary-stats">';
					html += '<div class="summary-stat">';
					html += '<span class="summary-stat-value">'+formatBytes(totalSaved)+'</span>';
					html += '<div class="summary-stat-label">Economizado</div>';
					html += '</div>';
					html += '<div class="summary-stat">';
					html += '<span class="summary-stat-value">-'+totalReduction+'%</span>';
					html += '<div class="summary-stat-label">Redução total</div>';
					html += '</div>';
					html += '</div>';
					html += '</div>';
					
					html += '<div class="results-table">';
					if(j.stats && j.stats.length > 0){
						j.stats.forEach(function(stat, idx){
							var link = j.links[idx];
							html += '<div class="result-row">';
							html += '<div class="result-name">'+stat.name+'</div>';
							html += '<div class="result-sizes">';
							html += '<div class="result-size">';
							html += '<span class="result-size-value">'+formatBytes(stat.originalSize)+'</span>';
							html += '<div class="result-size-label">Original</div>';
							html += '</div>';
							html += '<span class="result-arrow">→</span>';
							html += '<div class="result-size">';
							html += '<span class="result-size-value">'+formatBytes(stat.compressedSize)+'</span>';
							html += '<div class="result-size-label">Comprimido</div>';
							html += '</div>';
							html += '</div>';
							html += '<div class="result-reduction">';
							html += '<span class="result-reduction-value">-'+stat.reduction+'%</span>';
							html += '<div class="result-reduction-label">redução</div>';
							html += '</div>';
							html += '<div class="result-download">';
							html += '<a href="'+link+'" download><i class="glyphicon glyphicon-download"></i> Baixar</a>';
							html += '</div>';
							html += '</div>';
						});
					}
					html += '</div>';

					if(j.zip){
						html += '<a class="btn btn-lg btn-classic download-all" href="'+j.zip+'" download><i class="glyphicon glyphicon-compressed"></i> Baixar todos os arquivos</a>';
					}
					
					$('#result').html(html).fadeIn();
				}else{
					alert(j.status);
				}
			},
			error: function(xhr, status, error){
				console.log('Erro AJAX:', xhr.responseText);
				
				try {
					var response = JSON.parse(xhr.responseText);
					alert(response.status || 'Erro ao processar arquivos.');
				} catch(e) {
					alert('Erro ao processar arquivos: ' + xhr.status + ' - ' + error);
				}
			},
			complete: function(){
				$('#processar').text('Comprimir');
				$('#processar').removeAttr('disabled');
			}
		});
	});
}
</script>	</main>
