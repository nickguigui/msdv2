<script>
	function run() {
		var elComeOut = document.getElementById('roll');

		elComeOut.onclick = function() {
			rollDice();
		};

		function rollDice() {

			$('#roll button').attr('disabled',true);

			var dices = document.querySelectorAll('.dice');
			$('.result').hide();

			var total=0;

			dices.forEach(function(dice){

				var value = Math.floor((Math.random() * 6) + 1);
				var repeated = dice.classList.contains('show-' + value);

				total += value;

				for (var i = 1; i <= 6; i++) {
					dice.classList.remove('show-' + i);
					dice.classList.remove('show-flip-' + i);
					if (value == i) {
						if(repeated){
							dice.classList.add('show-flip-' + i)
						}else{
							dice.classList.add('show-' + i)
						}
					}
				}

			});

			setTimeout(function(){
				$('.result').html('Seu resultado: <span style="font-weight:500">'+total+'<span>');
				$('.result').show();
				$('#roll button').attr('disabled',false);
			},1500)
			
		}

		$('.quantity').change(function(){
			var num = $(this).val();

			var html='';
			for(var i=0; i<num; i++){
				var value = Math.floor((Math.random() * 6) + 1);
				html += '<div class="dice show-'+value+'"><div class="side one"><div class="dot one-1"></div></div><div class="side two"><div class="dot two-1"></div><div class="dot two-2"></div></div><div class="side three"><div class="dot three-1"></div><div class="dot three-2"></div><div class="dot three-3"></div></div><div class="side four"><div class="dot four-1"></div><div class="dot four-2"></div><div class="dot four-3"></div><div class="dot four-4"></div></div><div class="side five"><div class="dot five-1"></div><div class="dot five-2"></div><div class="dot five-3"></div><div class="dot five-4"></div><div class="dot five-5"></div></div><div class="side six"><div class="dot six-1"></div><div class="dot six-2"></div><div class="dot six-3"></div><div class="dot six-4"></div><div class="dot six-5"></div><div class="dot six-6"></div></div></div>';
			}
			$('.game').html(html);
		});
	}
