<style>
.mt-2{margin-top:8px}
.mt-4{margin-top:16px}
.circle{position:relative;width:200px;height:200px;border-radius:50%;background:#E9EAEE}
.circle:before{content:'';position:absolute;width:180px;height:180px;background-color:#fff;border-radius:50%;top:50%;left:50%;transform:translate(-50%, -50%)}
.dot{position:absolute;width:12px;/* half dot */height:50%;left:47.5%;top:0;transform:rotate(75deg);transform-origin:center bottom}
.dot:before{content:"";position:absolute;background-color:#fff;box-shadow:0 0 4px #333;width:24px;transform:translate3d(-25%, -25%, 0);padding-bottom:24px;border-radius:50%;cursor:pointer}
.debug{font-family:monospace;position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);z-index:100;font-size:32px;user-select:none}

.buttons{margin-top:32px;display:flex}
.buttons .btn-secondary{width:120px;height:40px;border-radius:40px;background-color:#EFEFEF;border:none;font-size:14px}
.buttons .btn-secondary:hover:enabled{background-color:#E7E7E7}
.buttons .btn-secondary:disabled{opacity:.65}
.task{position:relative;background-color:#fff;border:1px solid #eee;border-radius:4px;cursor:pointer;margin-bottom:8px;padding:0 12px;height:48px;overflow:hidden}
.task:hover{border-color:#ddd}
.task .icon{margin-right:8px;color:#999;fill:currentColor;width:24px;height:24px}
.task .editbuttons{position:absolute;right:0;top:0;bottom:0;display:flex}
.task button{width:44px;border:none;display:flex;justify-content:center;align-items:center;background-color:#fff}
.task button svg{fill:currentColor;width:20px;height:20px}
.task button.remove{color:#ef4444}
.task button.remove:hover{background-color:#fef2f2}
.task button.edit{color:#3b82f6}
.task button.edit:hover{background-color:#eff6ff}
.task.active svg{color:#DD6964}
.task.add{background-color:#fff;margin-bottom:0;height:48px}
.task input{width:100%;border:0;background-color:transparent}
.task input:focus{box-shadow:none !important;border:0 0 1px 0 solid #eee;outline:0}
.pill{background-color:transparent;border:none;font-size:14px;color:#333;border-radius:4px;padding:0 12px;height:32px;border-radius:16px}
.pill.active{background-color:#f5f5f5}

.segment{display:flex}
.segment button{background-color:transparent;border:1px solid #eee;border-right:none;font-size:14px;color:#333;width:100%;padding:4px}
.segment button:first-child{border-radius:4px 0 0 4px}
.segment button:last-child{border-radius:0 4px 4px 0;border-right:1px solid #eee}
.segment button:hover{background-color:#f9fafb}
.segment button.active{background-color:#f5f5f5}

.datenav{font-size:14px}
.datenav button{border:0;background-color:transparent;padding:2px;display:flex;justify-content:center;align-items:center}

.bars{margin:12px 0 36px 0;display:flex;justify-content:space-between}
.bars div{height:140px;background-color:#f7f7f7;position:relative}
.bars div:after{position:absolute;left:0;right:0;top:100%;display:block;text-align:center;content:attr(data-label);font-size:14px;color:#767676}
.bars span{background-color:#DD6964;position:absolute;bottom:0;left:0;right:0;animation:draw 0.5s ease-in-out}
@keyframes draw{ 0%{height:0} }
</style>

<div class="container">
    <h1>Pomodoro Timer</h1>
    <div class="box flex justify-center items-center" style="flex-direction:column">
        <div class="flex" id="stages" style="margin-bottom:32px">
            <button class="pill active" data-stage="P">Pomodoro</button>
            <button class="pill" data-stage="S">Pausa Curta</button>
            <button class="pill" data-stage="L">Pausa Longa</button>
        </div>
        <div class="circle">
            <div class="debug"></div>
            <div class="dot"></div>
        </div>
        <div class="buttons">
            <button class="btn-secondary" id="start" style="margin-right:8px">Iniciar</button>
            <button class="btn-secondary" id="giveup" style="margin-left:8px" disabled>Desistir</button>
        </div>
    </div>

    <div class="box flex justify-center" style="margin-top:25px">
        <div style="width:100%;max-width:400px">
            <div class="flex items-center" style="color:#767676;font-size:14px;margin-bottom:8px">
                <span style="margin-right:8px">TAREFAS</span>
                <a href="#" style="cursor:pointer" class="flex items-center" id="editmode">editar</a>
            </div>
            <div class="tasks">

            </div>
            <div class="flex items-center task add">                
                <svg class="icon"><use xlink:href="#add"/></svg>
                <span>Adicionar Tarefa</span>
            </div>
        </div>
    </div>

    <div class="box flex justify-center" style="margin-top:25px">
        <div style="width:100%;max-width:400px">
            <div style="color:#767676;font-size:14px">ESTATÍSTICAS</div>

            <div class="segment mt-2" id="period">
                <button class="active" id="week">Semana</button>
                <button id="month">Mês</button>
                <button id="year">Ano</button>
            </div>

            <div class="flex justify-between items-center mt-4 datenav">
                <button aria-label="Anterior" id="left"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960"><path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/></svg></button>
                <div id="date"></div>
                <button aria-label="Próxima" id="right"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></svg></button>
            </div>

            <div class="bars">

            </div>

            <hr style="margin:8px 0">
            <div class="flex justify-between items-center">
                <div>Total</div>
                <div style="font-size: 14px;" id="total"></div>
            </div>
            <hr style="margin:8px 0">
            <div class="flex justify-between items-center">
                <div>Média por dia</div>
                <div style="font-size: 14px;" id="average"></div>
            </div>
        </div>
        
    </div>
