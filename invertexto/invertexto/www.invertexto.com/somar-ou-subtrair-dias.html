	<h1>Somar ou Subtrair Dias</h1>
	<div class="box">
		<div class="flex justify-center align-center">
			<div class="wrapper">
				<div class="form-inline md-mb-6">
					<div class="form-group">
						<label for="data">Data</label>
						<input type="date" autocomplete="off" class="form-control" id="data" value="2026-07-29">
					</div>
					<div class="form-group">
						<span class="options">
							<input type="radio" checked name="opcao" class="option" id="add" value="add"><label for="add">Somar</label>
							<input type="radio" name="opcao" class="option" id="sub" value="sub"><label for="sub">Subtrair</label>
						</span>
					</div>
				</div>
						
				<div class="form-inline md-mb-6">
					<div class="form-group">
						<label for="ano">Anos</label>
						<input type="number" min="0" class="form-control spinner" id="ano" autocomplete="off" value="0">
					</div>
					<div class="form-group">
						<label for="mes">Meses</label>
						<input type="number" min="0" class="form-control spinner" id="mes" autocomplete="off" value="0">
					</div>
					<div class="form-group">
						<label for="dia">Dias</label>
						<input type="number" min="0" class="form-control spinner" id="dia" autocomplete="off" value="0">
					</div>
				</div>

				<button type="button" class="btn btn-classic mt-2" id="calcular" style="width:100%">Calcular</button>
				<span class="text-danger" id="error" style="display:none"></span>

<script>
function run(){
	$('#calcular').click(function(){
		var data = {
			data: $('#data').val(),
			ano: $('#ano').val(),
			mes: $('#mes').val(),
			dia: $('#dia').val(),
			opcao: $('input[name=opcao]:checked').val(),
		}

		$(document).ajaxStart(function(){
			$('#calcular').attr('disabled',true);
		})

		$(document).ajaxStop(function(){
			$('#calcular').attr('disabled',false);
		})

		$.ajax({type:'POST', data:data, url:'ajax/somar-ou-subtrair-dias.php', dataType:'json',
			success: function(r){
				if(r.status!='ok'){
					$('#error').text(r.status).show()
					return
				}
				console.log(r)
				$('#error').hide()
				$('.resultado').text(r.result).show()
			},error: function(e){
				$('#error').text('Erro inesperado.').show()
			}
		})
	})
}
</script>	</main>
