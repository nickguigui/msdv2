<style>
.box{background:#fff;padding:25px;border-radius:4px;box-shadow:0 1px 3px #0000001a;margin-bottom:20px}
.typing-container{max-width:900px;margin:0 auto}
.config-section{display:flex;gap:20px;margin-bottom:25px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.config-group{display:flex;align-items:center;gap:10px}
.config-group label{font-weight:500;color:#333}
.config-group select{padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:14px;cursor:pointer}
.timer-display{font-size:20px;font-weight:600;font-family:'Courier New',monospace;min-width:80px;text-align:center}
.stat-item{display:flex;flex-direction:column;align-items:center}
.stat-label{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:24px;font-weight:700;color:#2c3e50;margin-top:5px}
.text-wrapper{font-family:'Courier New',monospace;font-size:20px;line-height:1.8;border-radius:4px;overflow:hidden;user-select:none;background:#f8f9fa;margin-bottom:20px;height:calc(20px * 1.8 * 3 + 35px);padding:25px;cursor:text;position:relative}
.text-display{overflow:hidden;position:relative}
.text-display-inner{transition:transform .2s ease-out}
.text-display span{position:relative}
.text-display .correct{color:#27ae60}
.text-display .incorrect{color:#e74c3c;background:#fce4e4}
.text-display .current{background:#3498db;color:#fff;animation:blink 1s infinite}
@keyframes blink {
	0%,50%{opacity:1}
	51%,100%{opacity:.3}
}
.typing-input{position:absolute;opacity:0;pointer-events:none}
.control-buttons{display:flex;gap:15px;margin-top:20px}
.btn-secondary{background:#95a5a6;color:#fff}
.btn-secondary:hover{background:#7f8c8d;color:#fff}
.btn:focus{box-shadow:none;outline:0!important}
.focus-indicator{text-align:center;color:#666;font-size:14px;margin-bottom:15px;min-height:20px}
.focus-indicator.active{color:#3498db;font-weight:500}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-bottom:30px}
.result-item{padding:20px;background:#f8f9fa;border-radius:6px;display:flex;flex-direction:column;align-items:center}
.result-label{font-size:14px;color:#666;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.result-value{font-size:32px;font-weight:700;color:#3498db}
.result-value.accuracy{color:#27ae60}
.modal-title-custom{font-size:24px;font-weight:700;color:#2c3e50;text-align:center;margin-bottom:15px}
.result-description{font-size:18px;color:#555;text-align:center;margin-bottom:25px;line-height:1.6}
.result-description strong{color:#3498db;font-weight:700}
.accuracy-bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin:20px 0}
.accuracy-fill{height:100%;background:linear-gradient(90deg,#27ae60,#2ecc71);transition:width .5s ease}
.info-text{font-size:14px;color:#666;margin-top:15px}
@media (max-width: 768px) {
	.text-wrapper{font-size:18px;line-height:1.6;padding:15px;height:calc(18px * 1.6 * 3 + 20px)}
	.results-grid{grid-template-columns:1fr;gap:15px}
}
</style>

<div class="container">
	<h1>Teste de Digitação</h1>
	
	<div class="box">
		
		<div class="config-section">

			<div style="display: flex; gap: 20px; flex-wrap: wrap;">
				<div class="config-group">
					<select id="textType" aria-label="Texto">
						<option value="with-accents">Com acentos</option>
						<option value="without-accents">Sem acentos</option>
					</select>
				</div>

				<div class="config-group">
					<select id="duration" aria-label="Duração">
						<option value="15">15 segundos</option>
						<option value="30">30 segundos</option>
						<option value="60" selected>1 minuto</option>
						<option value="120">2 minutos</option>
						<option value="180">3 minutos</option>
						<option value="300">5 minutos</option>
						<option value="600">10 minutos</option>
					</select>
				</div>
			</div>

			<div class="timer-display" id="timer">01:00</div>
		</div>

		<div class="text-wrapper" id="textWrapper">
			<div class="text-display" id="textDisplay"></div>
		</div>

		<input 
			type="text" 
			class="typing-input" 
			id="typingInput" 
			autocomplete="off"
			autocorrect="off"
			autocapitalize="off"
			spellcheck="false"
		>

		<div class="control-buttons">
			<button class="btn btn-classic" id="newTestBtn">Novo Teste</button>
			<button class="btn btn-secondary" id="resetBtn">Reiniciar</button>
		</div>
	</div>
</div>

<!-- Modal Bootstrap 3 -->
<div class="modal fade" id="resultsModal" tabindex="-1" role="dialog">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
				<h4 class="modal-title">Resultado</h4>
			</div>
			<div class="modal-body">
				<h3 class="modal-title-custom">Teste de Digitação Finalizado!</h3>
				
				<p class="result-description">
					Sua velocidade foi de <strong id="finalWpm">0</strong> PPM com <strong class="accuracy-highlight" id="finalAccuracy">0%</strong> de precisão.
				</p>

				<div class="accuracy-bar">
					<div class="accuracy-fill" id="accuracyBar"></div>
				</div>

				<p class="info-text">
					Você digitou <strong id="finalWords">0</strong> palavras corretas em <strong id="finalTime">0</strong> segundos.
				</p>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-classic" id="tryAgainBtn">Tentar Novamente</button>
				<button type="button" class="btn btn-default" data-dismiss="modal">Fechar</button>
			</div>
		</div>
	</div>
