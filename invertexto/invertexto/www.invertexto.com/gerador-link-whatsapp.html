				<div class="form-group">
					<label for="numero" style="display:block">Número</label>
					<input type="tel" class="form-control" id="numero">
				</div>

                    <textarea class="form-control" id="mensagem" rows="4"></textarea>
				</div>
				<button type="button" class="btn btn-classic process mr-1" id="gerar">Gerar Link</button>
				<button type="button" class="btn btn-classic process" id="iniciar">Iniciar Conversa</button>

                <div class="alert alert-danger" id="error" style="margin:24px 0 0 0;display:none">Número de telefone inválido.</div>

                <div id="result-box" style="margin-top:24px;display:none">
                    <label for="result">Resultado</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="result" style="background-color:#fff" readonly>
                        <span class="input-group-btn">
                            <button class="btn btn-default" type="button" id="copiar" title="Copiar" aria-label="Copiar" data-clipboard-target="#result"><span class="glyphicon glyphicon-copy text-muted"></span></button>

<script>
function run(){

    var opened=false;

    const input = document.querySelector("#numero");
    const phoneInput = window.intlTelInput(input,({
        initialCountry:'BR',
        preferredCountries:['BR'],
        utilsScript:'/js/intlTelInput-utils.js'
    }));

    $('#numero,#mensagem').on('input',function(e){
        if(opened) $('#result-box').hide();
    });

    $('#numero').keydown(function(e){
        if(e.keyCode==13) $('#gerar').click();
    });

	$('#result').click(function(){
		this.select();
	});

	$('.process').click(function(){

        const id = $(this).attr('id');

        var phoneNumber = phoneInput.getNumber();
        if (!phoneNumber || !phoneInput.isValidNumber()) {
            opened=false;
            $('#result-box').hide();
            $('#error').show();
            return;
        }

        $('#error').hide();
		var mensagem = $('#mensagem').val();
		var link = 'https://api.whatsapp.com/send?phone='+phoneNumber.replace('+','');

		if(mensagem.length>0){
			link += '&text='+encodeURIComponent(mensagem);
		}

        if(id=='gerar'){
            $('#result').val(link);
            $('#result-box').show();
            opened=true;
            return;
        }

        window.open(link);
	});

	// Clipboard
	$('#copiar').tooltip({
		trigger: 'manual',
		placement: 'bottom'
	});

	function setTooltip(btn, message) {
		btn.attr('data-original-title', message)
		.tooltip('show');
	}

	function hideTooltip(btn) {
		setTimeout(function() {
			btn.tooltip('hide');
		}, 1000);
	}

	var clipboard = new ClipboardJS('#copiar');
	clipboard.on('success', function(e) {
		var btn = $(e.trigger);
		setTooltip(btn, 'Copiado');
		hideTooltip(btn);
		e.clearSelection();
        $('#copiar').blur();
	});
}
