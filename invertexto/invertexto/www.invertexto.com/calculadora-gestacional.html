<script>
function run(){
	$('#calcular').click(function() {

		var dia = $('#dia').val();
		var mes = $('#mes').val();
		var ano = $('#ano').val();

		$(document).ajaxStart(function(){
			$("#calcular").attr('disabled', true);
		});
	
		$(document).ajaxStop(function(){
			$("#calcular").removeAttr('disabled');
		});

		$.ajax({
			method: "POST",
			url: "ajax/calculadora-gestacional.php",
			dataType: "json",
			data: {dia:dia,mes:mes,ano:ano}

		}).done(function(json) {
			if(json.status=='OK'){

				if(json.weeks != '0'){
					$('#semanas').show();
					$('#semanas span').text(json.weeks);
				}else{
					$('#semanas').hide();
				}

				$('.result').show();
				$('#data-completa').text(json.date);

			}else{
				alert(json.status);
			}
		});
	});
}
