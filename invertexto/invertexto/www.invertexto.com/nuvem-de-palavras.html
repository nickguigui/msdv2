<style>
.flex{display:flex}
.flex-1{flex:1}
.row{display:flex;flex-wrap:wrap}
.box{background:#fff;padding:25px;border-radius:4px;height:100%}
.box label{font-weight:400}
.wrapper{display:flex;width:100%;gap:20px}
.tool-left{width:320px}
.tool-right{flex:1}
#wordcloud-canvas{width:100%;height:100%;min-height:600px;background:#fff;border-radius:4px;object-fit:contain;display:block}
.control-group{margin-bottom:15px}
.color-preset{display:inline-block;width:30px;height:30px;border-radius:4px;cursor:pointer;margin-right:8px;border:2px solid transparent;transition:all .3s;position:relative}
.color-preset:hover{transform:scale(1.1)}
.color-preset.active::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:16px;font-weight:700;text-shadow:0 1px 2px #0000004d}
.button-group{display:flex;flex-direction:column;gap:8px;margin-top:40px}
.size-inputs{display:flex;gap:10px;align-items:center}
.size-inputs input{flex:1}
.size-inputs span{font-weight:400}
@media (max-width: 767px) {
	.wrapper{flex-direction:column;gap:0}
	.tool-left{width:100%}
	.tool-right{width:100%}
	.tool-right canvas{width:100%;display:block}
}

<div class="container">
	<h1>Nuvem de Palavras</h1>
	
	<div class="wrapper">
		<!-- Coluna Esquerda: Controles -->
		<div class="tool-left">
			<div class="box">
				<div class="form-group">
					<textarea id="input-text" class="form-control" rows="5" placeholder="Cole seu texto aqui..." aria-label="Texto"></textarea>
				</div>
				
				<div class="control-group">
					<label>Esquema de cores:</label>
					<div>
						<div class="color-preset active" data-scheme="blue" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);" title="Azul/Roxo"></div>
						<div class="color-preset" data-scheme="warm" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);" title="Quente"></div>
						<div class="color-preset" data-scheme="nature" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);" title="Natureza"></div>
						<div class="color-preset" data-scheme="sunset" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);" title="Pôr do sol"></div>
						<div class="color-preset" data-scheme="forest" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);" title="Floresta"></div>
						<div class="color-preset" data-scheme="vibrant" style="background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);" title="Vibrante"></div>
					</div>
				</div>

				<div class="control-group">
					<label for="bg-color">Cor de fundo:</label>
					<select id="bg-color" class="form-control">
						<option value="#ffffff">Branco</option>
						<option value="#000000">Preto</option>
						<option value="#f0f0f0">Cinza claro</option>
						<option value="#333333">Cinza escuro</option>
						<option value="transparent">Transparente</option>
					</select>
				</div>

				<div class="control-group">
					<label for="font-family">Fonte:</label>
					<select id="font-family" class="form-control">
						<option value="Impact">Impact</option>
						<option value="Arial">Arial</option>
						<option value="Helvetica">Helvetica</option>
						<option value="Georgia">Georgia</option>
						<option value="Times New Roman">Times New Roman</option>
						<option value="Courier New">Courier New</option>
						<option value="Verdana">Verdana</option>
					</select>
				</div>

				<div class="control-group">
					<label for="rotation">Rotação das palavras:</label>
					<select id="rotation" class="form-control">
						<option value="none">Sem rotação</option>
						<option value="random" selected>Aleatória</option>
						<option value="vertical">Apenas vertical</option>
					</select>
				</div>

				<div class="control-group">
					<label for="max-words">Número máximo de palavras:</label>
					<input type="number" id="max-words" class="form-control" value="100" min="10" max="500" step="10">
				</div>

				<div class="control-group">
					<label for="weight-factor">Fator de peso:</label>
					<input type="number" id="weight-factor" class="form-control" value="" min="3" max="100" placeholder="Automático">
				</div>

				<div class="control-group">
					<label>Resolução da imagem:</label>
					<div class="size-inputs">
						<input type="number" id="export-width" class="form-control" value="800" min="800" max="4096" step="100">
						<span>×</span>
						<input type="number" id="export-height" class="form-control" value="800" min="600" max="4096" step="100">
					</div>
					<small class="help-block">Largura × Altura (pixels)</small>
				</div>

				<div class="button-group">
					<button id="btn-generate" class="btn btn-classic">Gerar</button>
					<button id="btn-download" class="btn btn-success" disabled>Baixar</button>
				</div>
			</div>
		</div>

		<!-- Coluna Direita: Canvas -->
		<div class="tool-right">
			<div class="box">
				<div class="canvas-container">
					<canvas id="wordcloud-canvas"></canvas>
				</div>
			</div>
		</div>
	</div>
