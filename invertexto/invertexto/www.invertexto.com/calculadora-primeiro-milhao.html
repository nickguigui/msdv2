<div class="container">
	<h1>Calculadora do Primeiro Milhão</h1>

	<div class="row">
		<div class="col-md-11">
			<div class="box">
				<h2>POUPANÇA NECESSÁRIA</h2>
				<div class="form-group">
					<label for="objetivo1">Valor desejado <span>(R$)</span></label>
					<input type="text" name="objetivo1" class="form-control numerico" id="objetivo1" value="1.000.000,00">
				</div>
				<div class="form-group">
					<label for="juros1">Taxa de juros mensal <span>(%)</span></label>
					<input type="text" name="juros1" class="form-control numerico" id="juros1">
				</div>
				<div class="form-group">
					<label for="periodo1">Período para atingir objetivo <span>(anos)</span></label>
					<input type="text" name="periodo1" class="form-control" id="periodo1" onkeypress="return onlyNumbers(event)" maxlength="3">
				</div>
				<button type="submit" class="btn btn-classic" id="calc1">Calcular</button>

				<div class="result">
					Poupança mensal: <span class="bold calculo1"></span>
				</div>
			</div>
		</div>
		<div class="col-md-1"></div>
		<div class="visible-xs visible-sm space"></div>

		<div class="col-md-11">
			<div class="box">
				<h2>TEMPO NECESSÁRIO</h2>
				<div class="form-group">
					<label for="objetivo2">Valor desejado <span>(R$)</span></label>
					<input type="text" name="objetivo2" class="form-control numerico" id="objetivo2" value="1.000.000,00">
				</div>
				<div class="form-group">
					<label for="juros2">Taxa de juros mensal <span>(%)</span></label>
					<input type="text" name="juros2" class="form-control numerico" id="juros2">
				</div>
				<div class="form-group">
					<label for="poupanca2">Poupança mensal <span>(R$)</span></label>
					<input type="text" name="poupanca2" class="form-control numerico" id="poupanca2">
				</div>
				<button type="submit" class="btn btn-classic" id="calc2">Calcular</button>

				<div class="result">
					Período para atingir objetivo: <span class="bold calculo2"></span>
				</div>
			</div>
		</div>

<script>
function onlyNumbers(event){
	var key = window.event ? event.keyCode : event.which;
	if (key < 48 || key > 57) return false;
	else return true;
}

function run(){
	$('.numerico').number(true, 2, ',', '.');

	//formata números
	Number.prototype.formatMoney = function(c, d, t){
	var n = this, 
		c = isNaN(c = Math.abs(c)) ? 2 : c, 
		d = d == undefined ? "." : d, 
		t = t == undefined ? "," : t, 
		s = n < 0 ? "-" : "", 
		i = parseInt(n = Math.abs(+n || 0).toFixed(c)) + "", 
		j = (j = i.length) > 3 ? j % 3 : 0;
		return s + (j ? i.substr(0, j) + t : "") + i.substr(j).replace(/(\d{3})(?=\d)/g, "$1" + t) + (c ? d + Math.abs(n - i).toFixed(c).slice(2) : "");
	 };

	//cálculo I
	$('#calc1').click(function(){
		var objetivo = $("input[name='objetivo1']").val();
		var juros = $("input[name='juros1']").val();
		var periodo = $("input[name='periodo1']").val();
		
		var meses = periodo*12;
		var jurosdecimal = juros/100;
		var d = 1+jurosdecimal;
		
		var calculo = objetivo*(jurosdecimal/(Math.pow(d,meses)-1));
		calculo = calculo.formatMoney(2, ',', '.');
		
		var resultado = 'R$ '+calculo;
		$('span.calculo1').text(resultado);
	});

	//cálculo II
	$('#calc2').click(function(){
		var objetivo = $("input[name='objetivo2']").val();
		var juros = $("input[name='juros2']").val();
		var poupanca = $("input[name='poupanca2']").val();
		
		var jurosdecimal = juros/100;
		var d = 1+jurosdecimal;
		
		var calculo = Math.log(((objetivo*jurosdecimal)/poupanca)+1)/Math.log(d);
		anos = calculo/12;
		anos = anos.formatMoney(2, ',', '.');
		
		var resultado = anos+' anos';
		$('span.calculo2').text(resultado);
	});
}
</script>	</main>
