<script>
function run(){
	Dropzone.autoDiscover = false;
	var myDropzone = new Dropzone('#previews', {
		uploadMultiple: false,
		autoProcessQueue: false,
		maxFiles: 1,
		paramName: "file",
		maxFilesize: 16,
		acceptedFiles: '.png, .jpg, .jpeg, .bmp, .pbm',
		previewTemplate: '<div class="file"><img src="" class="img-responsive"></img></div>',
		dictDefaultMessage: '<i class="glyphicon glyphicon-download-alt drop"></i><p>Arraste a imagem ou clique aqui.</p>',
		dictInvalidFileType: 'Tipo de arquivo não suportado.',
		dictMaxFilesExceeded: '0',
		maxfilesexceeded: function(file) {
			this.removeAllFiles();
			this.addFile(file);
		},
		init: function() {
			this.on("addedfile", function(file) {
				var lang = $('#lang').val();

				// Preview
				var reader = new FileReader();
				reader.onload = function(event) {
					if(!file.accepted) return;
					file.previewTemplate.childNodes[0].setAttribute('src', event.target.result);
				};
				reader.readAsDataURL(file);

				// OCR
				$('.botao').html('<span class="glyphicon glyphicon-refresh loading"></span>');
				Tesseract.recognize(
					file,
					lang,
					{logger: m => {
						// console.log(m);
					}}
				).then(({ data: { text } }) => {
					$('.destino').val(text);
				}).catch((err) => {
					$('.destino').val('Erro inesperado.');
				}).finally(() => {
					$('.botao').html('<span class="glyphicon glyphicon-menu-right hidden-xs"></span><span class="glyphicon glyphicon-menu-down visible-xs"></span>');
				});
			});
  		}

	});

	$('body').on('click', '.file img', function(){
		$('#previews').click();
	});
}
