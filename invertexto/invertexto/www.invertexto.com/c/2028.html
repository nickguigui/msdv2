<script>
function run(){
	$('#display').countdown('2028/01/01 00:00:00', function(event) {
		$(this).html(
			event.strftime('<b>%-D</b> dia%!D <b>%-H</b> hora%!H <b>%-M</b> minuto%!M <b>%-S</b> segundo%!S')
		);
	});

	$('#show-full').click(function(event){
		event.preventDefault();
		$('.countdown').addClass('fullscreen');
	});

	$('body').on('click', '.fullscreen', function() {
		$('.countdown').removeClass('fullscreen');
	});

	$('#color').change(function(){
		var color = $(this).val();
		color=='dark' ? $('.box').addClass('dark') : $('.box').removeClass('dark');
	});

	$('#size').change(function(){
		var size = $(this).val();
		var clockSize = Math.round(size * 0.73);
		$('.countdown h1').css('font-size', size+'px');
		$('.countdown .clock').css('font-size', clockSize+'px');
	});
}
</script>	</main>
