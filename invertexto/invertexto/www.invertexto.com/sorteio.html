<div class="container">
	<h1>Sorteio Online</h1>
	<div class="box">
					<div class="wrapper">
				<div class="flex items-center justify-center" style="font-size:24px;margin-bottom:20px">
					<span style="margin-right:8px">Sortear</span>
					<input type="number" class="form-control" value="1" min="1" id="qtd" style="width:60px">
					<span style="margin-left:8px" id="word">nome</span>
				</div>

				<div class="form-group" style="margin-bottom:20px">
					<textarea name="lista" class="form-control" id="lista" rows="8" placeholder="Insira um nome por linha..."></textarea>
				</div>

				<div class="alert alert-danger" id="error" style="display:none"></div>
				<div id="result"></div>

				<button class="btn btn-classic w-full" id="sortear">Sortear</button>
			</div>
			</div>
</div>

<script>
function run(){
	$('#qtd').change(function(){
		const str = this.value > 1 ? 'nomes' : 'nome';
		$('#word').text(str);
	});

	$('#sortear').click(function(){
		const data = {
			qtd: $('#qtd').val(),
			lista: $('#lista').val()
		};

		$(document).ajaxStart(function(){
			$(this).attr('disabled', true);
		});

		$(document).ajaxStop(function(){
			$(this).removeAttr('disabled');
		});

		$.ajax({type:'post', data:data, url:'/ajax/sorteio.php', dataType:'json',
			success: function(j){
				if(j.status != 'ok'){
					$('#error').text(j.status).show();
					return;
				}
				location.href = 'sorteio/'+j.id;
			},
			error: function(e){
				$('#error').text('Erro inesperado.').show();
			}
		});
	});

	// Clipboard
	$('#copiar').tooltip({
		trigger: 'manual',
		placement: 'bottom'
	});

	function setTooltip(btn, message) {
		btn.attr('data-original-title', message)
		.tooltip('show');
	}

	function hideTooltip(btn) {
		setTimeout(function() {
			btn.tooltip('hide');
		}, 1000);
	}

	var clipboard = new ClipboardJS('#copiar');
	clipboard.on('success', function(e) {
		var btn = $(e.trigger);
		setTooltip(btn, 'Copiado');
		hideTooltip(btn);
		e.clearSelection();
        $('#copiar').blur();
	});
}
</script>	</main>
