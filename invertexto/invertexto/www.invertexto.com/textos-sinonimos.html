<script>
function run(){
	
	var $selecionado;

	var popOverSettings = {
		selector:'.destino a',
		content:fetchData,
		html:true,
		trigger:'focus',
		container:'body',
		placement:'bottom'
	};

	function fetchData(){

		$selecionado = $(this);
		var palavraId = $selecionado.attr('id');
		var contentId = $.now();

		$.ajax({
			type:'post', data:{id:palavraId}, url:'ajax/spinner-sinonimos.php', dataType:'json',
			success: function(j){
				
				var ul = '<ul class="sinonimos">';
				j.forEach(function(item){
					ul += '<li data-id="'+item.id+'">'+item.palavra+'</li>';
				});
				ul += '</ul>';

				$('#' + contentId).html(ul);
			}
		});

		return '<div id="' + contentId + '" style="padding:10px">Carregando...</div>';
	}

	// Texto com links
	function geraTextoComLinks(){
		var $button = $('#processa');
		var texto = $('.origem').val();

		$.ajax({
			type:'post', data:{texto:texto}, url:'ajax/spinner.php', dataType:'json',
			beforeSend: function(){
				$button.attr('disabled', true);
				$button.html('<i class="glyphicon glyphicon-refresh loading"></i>');
			},
			success: function(j){

				if(j.status=='OK'){
					$('.destino').html(j.texto);
					$('body').popover(popOverSettings);
				}else{
					alert(j.status);
				}
			},
			complete: function(){
				$button.attr('disabled', false);
				$button.html('<i class="glyphicon glyphicon-menu-right hidden-xs"></i><i class="glyphicon glyphicon-menu-down visible-xs"></i>');
			}
		});
	}

	$('#processa').click(function(){
		geraTextoComLinks();
	});

	// Troca de palavras
	$('body').on('click', '.sinonimos li', function(){
		var $li = $(this);
		var palavra = $li.text();
		var palavraId = $li.attr('data-id');

		$selecionado.text(palavra);

		if($selecionado.attr('id')!=palavraId){
			$selecionado.addClass('text-changed');
		}else{
			$selecionado.removeClass('text-changed');
		}
	});

	// User Experience
	geraTextoComLinks();
}
</script>	</main>
