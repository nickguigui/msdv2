<script>
function run(){
	$('#calcular').click(function(){
		var data = {
			day: $('#day').val(),
			month: $('#month').val(),
			year: $('#year').val(),
		};

		$(document).ajaxStart(function(){
			$('#calcular').attr('disabled', true);
		});

		$(document).ajaxStop(function(){
			$('#calcular').removeAttr('disabled');
		});

		$.ajax({type:'post', data:data, url:'ajax/calcular-idade.php', dataType:'json',
			success: function(j){
				if(!j.error){
					$('#result_data').html('<p>'+j.full+'</p><p>'+j.days+' dias</p><p>'+j.hours+' horas</p><p>'+j.minutes+' minutos</p><p style="margin-bottom:0">'+j.next+'</p>');
					$('.resultado').show();
				}else{
					alert(j.error);
				}
			}
		});
	});

	$('.box input').keydown(function(e){
		if(e.keyCode == 13) $('#calcular').click();
	});
}
</script>
