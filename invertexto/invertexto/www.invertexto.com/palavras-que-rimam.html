<script>
function run(){

    $('#pesquisar').click(function(){
        $(document).ajaxStart(function(){
            $('#pesquisar').attr('disabled',true)
        });

        $(document).ajaxStop(function(){
            $('#pesquisar').attr('disabled',false)
        });

        const data = {
            word: $('#word').val()
        };

        $.ajax({type:'post', url:'/ajax/rimas.php', data:data, dataType:'json',
            success:function(j){

                if(j.status=='ok'){
                    let html = ''
                    for (item of j.result) {
                        html += '<div class="item">'+item+'</div>'
                    }
                    $('.result').html(html).show();
                    $('#error').hide()
                    return;
                }

                $('#error').text(j.status).show();
                $('#word').focus();
            },
            error:function(e){
                $('#error').text('Erro inesperado.').show();
            }
        });
    });

    $('#word').keydown(function(event){
		if(event.keyCode == 13) $('#pesquisar').click();
	});

	var clipboard = new ClipboardJS('.result .item', {
        text: function(trigger) {
            return trigger.innerText;
        }
    });

	clipboard.on('success', function(e) {
		var btn = $(e.trigger);
		btn.toggleClass('copied');
		e.clearSelection();
	});
}
</script>	</main>
