<script>
function run(){

	var scalex=1;
	var scaley=1;

	var image = document.querySelector('#target');
	var options = {
		viewMode: 2,
		autoCropArea: 0.5,
		crop(event){
			$('#x').val(event.detail.x);
			$('#y').val(event.detail.y);
			$('#w').val(event.detail.width);
			$('#h').val(event.detail.height);
			$('#scalex').val(event.detail.scaleX);
			$('#scaley').val(event.detail.scaleY);
			$('#rotate').val(event.detail.rotate);
		}
	};

	var cropper = new Cropper(image, options);

	$('#rotate-right').click(function(){
		cropper.rotate(45);
	});

	$('#rotate-left').click(function(){
		cropper.rotate(-45);
	});

	$('#zplus').click(function(){
		cropper.zoom(0.1);
	});

	$('#zminus').click(function(){
		cropper.zoom(-0.1);
	});

	$('#scale-x').click(function(){
		scalex = -scalex;
		cropper.scaleX(scalex);
	});

	$('#scale-y').click(function(){
		scaley = -scaley;
		cropper.scaleY(scaley);
	});

	$('#ratio').change(function(){
		var val = $(this).val();
		if(val=='') cropper.setAspectRatio(NaN);
		if(val=='1:1') cropper.setAspectRatio(1/1);
		if(val=='4:3') cropper.setAspectRatio(4/3);
		if(val=='16:9') cropper.setAspectRatio(16/9);
	});

	$('input[type=file]').on('change', function (e){
		var file = e.target.files[0];
		var fr = new FileReader();

		if(file.size>8000000){
			$('#error').text('Tamanho limitado a 8 MB.').show();
			return;
		}

		if(file.type!='image/jpeg' && file.type!='image/png'){
			$('#error').text('Envie apenas arquivos JPG ou PNG.').show();
			return;
		}

		$('#error').hide();

		fr.onload = function(theFile){
			var image = new Image();
			image.src = theFile.target.result;

			image.onload = function() {
				var image = document.getElementById('target');
				image.src = theFile.target.result
				cropper.destroy();
				cropper = new Cropper(image, options);
			};
		};

		fr.readAsDataURL(file);
  	});
}
