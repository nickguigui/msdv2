<script>
function run(){
    $('.box input').keyup(function(){
        var num1 = $('#num1').val();
        var num2 = $('#num2').val();
        var num3 = $('#num3').val();
        if(num1.length>0 && num2.length>0 && num3.length>0){
            var result = (num3*num2)/num1;
            $('.result').text(result.toLocaleString());
        }
    });
}
</script>	</main>
