<script>
function run(){

	$('.process').click(function() {

		var texto = $('.origem').val();
		var binario = $('.destino').val();
		var tipo = $(this).attr('name');
		var thisBtn = $(this);

		thisBtn.attr('disabled', true);

		$.post('ajax/codigo-binario.html', {texto:texto,binario:binario,tipo:tipo}, function(data) {
			if(tipo=='encode'){
				$('.origem').val('');
				$('.destino').val(data);
			}else if(tipo=='decode'){
				$('.origem').val(data);
				$('.destino').val('');
			}
			thisBtn.removeAttr('disabled');		
		});
	});
}
</script>	</main>
