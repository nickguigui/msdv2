<script>
function run(){

    let type='';
    const reader = document.getElementById('reader');
    const cameraButton = document.getElementById('camerabtn');
    const stopButton = document.getElementById('stopbtn');
    const fileButton = document.getElementById('fileform');
    const resultText = document.getElementById('result');

    const html5QrCode = new Html5Qrcode("reader");

    cameraButton.addEventListener('click', function(){
        type = 'camera';
        
        resultText.parentElement.parentElement.style.display = 'none';
        cameraButton.innerHTML = 'Carregando...'
        cameraButton.disabled = true
        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                var cameraId = devices[0].id;

                const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                    displayText(decodedText);

                    html5QrCode.stop().then(ignore => {
                        close()
                    })
                };

                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                // html5QrCode.start({ deviceId: { exact: cameraId} }, config, qrCodeSuccessCallback);
                html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback);
            }
        }).catch(err => {
            console.log(`Error scanning câmera. Reason: ${err}`)
        });
    });

    function displayText(text){
        if (text.slice(0, 4) == 'http') {
            resultText.innerHTML = '<a href="'+text+'" target="_blank">'+text+'</a>';
        }else{
            resultText.innerText = text;
        }
        resultText.parentElement.parentElement.style.display = 'block';
    }

    function close(){
        reader.innerHTML = ''
        cameraButton.style.display = 'block'
        fileButton.style.display = 'block'
        stopButton.style.display = 'none'
        fileButton.reset()
    }

    stopButton.addEventListener('click', function(){
        if(html5QrCode.getState() == 2){
            html5QrCode.stop().then(ignore => {
                close()
            })
        }else{
            close()
        }
    })

    new ResizeObserver(function(entries){
        if(entries[0].contentRect.height > 0){
            if(type != 'file'){
                cameraButton.style.display = 'none'
                fileButton.style.display = 'none'
                stopButton.style.display = 'block'
            }
            
            cameraButton.innerHTML = '<i class="glyphicon glyphicon-camera"></i> Abrir Câmera'
            cameraButton.disabled = false
        }
    }).observe(reader)

    fileButton.addEventListener('change', e => {
        if (e.target.files.length == 0) {
            return;
        }

        type = 'file';
        const imageFile = e.target.files[0];

        html5QrCode.scanFile(imageFile, true)
            .then(decodedText => {
                displayText(decodedText);
                $('#error').hide();
            })
            .catch(err => {
                console.log(`Error scanning file. Reason: ${err}`)
                $('#error').html('Não foi possível ler o código dessa imagem.').show();
                resultText.parentElement.parentElement.style.display = 'none';
            });
    });

    // Tooltip
	$('.copy-btn').tooltip({
		trigger: 'manual',
		placement: 'bottom'
	});

	function setTooltip(btn, message) {
		btn.attr('data-original-title', message).tooltip('show');
	}

	function hideTooltip(btn) {
		setTimeout(function() {
			btn.tooltip('hide');
		}, 1000);
	}

	// Clipboard
	var clipboard = new ClipboardJS('.copy-btn');

	clipboard.on('success', function(e) {
		var btn = $(e.trigger);
		setTooltip(btn, 'Copiado');
		hideTooltip(btn);
		e.clearSelection();
	});
}
</script>	</main>
