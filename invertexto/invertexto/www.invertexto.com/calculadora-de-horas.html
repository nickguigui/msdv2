<script>
function run(){
	$('.tool').on('keypress', 'input', function(e){
		var keycode = window.event ? e.keyCode : e.which;
		if (keycode >= 48 && keycode <= 57) return true;
		return false;
	});

	$('.tool').on('blur', 'input', function(){
		$(this).val(function(i, v) {
			while (v.length < 2) v = '0' + v;
			return v;
		});
	});

	$('.tool-column').on('focus', '.tool-inputs:last-child input', function(){
		$('.tool-column').append('<div class="tool-inputs"><input type="text" class="form-control" maxlength="2"> <span>:</span> <input type="text" class="form-control" maxlength="2"></div>');
	});

	$('.tool').on('keyup', 'input', function(){
		// if (e.key === 'Tab' || e.key === 'Enter') {
		if ($(this).val().length >= 2) {
			if ($(this).next().is('span')) $(this).next().next().focus().select();
			else if ($(this).parent().next().is('.tool-inputs')) $(this).parent().next('.tool-inputs').children('input:eq(0)').focus().select();
		}
	});

	$('.tool').on('keyup', 'input', function(){
		var horas=0;
		var minutos=0;
		$('.tool-inputs').each(function(){
			var h = parseInt($(this).find('input:eq(0)').val(), 10);
			var m = parseInt($(this).find('input:eq(1)').val(), 10);
			if (!isNaN(h)) horas += h;
			if (!isNaN(m)) {
				minutos += m;
				if (minutos / 60 >= 1) {
					horas += Math.floor(minutos / 60);
					minutos = minutos % 60
				}
			}
		});

		var stringHoras = (horas < 10 ? '0': '') + horas;
		var stringMinutos = (minutos < 10 ? '0': '') + minutos;
		$('.tool-result').text(stringHoras+':'+stringMinutos);
	});

	$('#limpar').click(function(){
		$('.tool input').val('');
		$('.tool-result').text('00:00');
	});
}
