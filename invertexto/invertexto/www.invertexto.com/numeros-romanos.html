<script>
function run(){

	var _values = [ 1000000, 900000, 500000, 400000, 100000, 90000, 50000, 40000, 10000, 9000, 5000, 4000, 1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1 ];
	var _strings = [ "M", "CM", "D", "CD", "C", "XC", "L", "XL", "X", "IX", "V", "IV", "M", "CM", "D", "CD", "C", "XC", "L", "XL", "X", "IX", "V", "IV", "I"];

	var makeRoman = function() {
		var value = $("#decimal").val();
		if(value.length==0){
			$("#result1").html("");
			return;
		}
		var num = parseInt(value.replace(/,/g, ""));
		if ( isNaN(num) ) {
			$("#result1").html("Digite um número válido");
			return;
		}
		if ( num > 3999999 || num < 1) {
			$("#result1").html("Digite um número entre 1 e 3.999.999");
			return;
		} 
		var work = num;
		var res = "";
		while ( work > 0 ) {
			for (var i=0; i<_values.length; i++) {
				if ( work >= _values[i] ) {
					if ( _values[i] > 1000 ) {
						res += '<span class="overline">' + _strings[i] + '</span>';
					}
					else {
						res += _strings[i];
					}
					work -= _values[i];
					break;
				}
			}
		}
		$("#result1").html( Number(num).toLocaleString('pt') + " = " + res );
	};


	$('#decimal').keyup(function(){
		makeRoman();
	});

	//===========================//

	var digits = ["I","V","X","L","C","D","M"];
	var _tokens = ["M","CM","D","CD","CCC","CC","C","XC","L","XL","XXX","XX","X","IX","V","IV","III","II","I"];
	var _valuesx = [1000,900,500,400,300,200,100,90,50,40,30,20,10,9,5,4,3,2,1];
	var _invalid = ["CMCM","CMD","CMCD","CMC","DD","DCD","CDCD","CDC","CCCC","XCXC","XCL","XCXL","XCX","LL","LXL","XLXL","XLX","XXXX","IXIX","IXV","IXIV","IXI","IVIV","IVI","IIII", "VV", "VIV"];
	var _replace = ["MDCCC","MCD","MIII","M","M","CM","DCCC","D","CD","CLXXX","CXL","CIII","C","C","XC","LXXX","L","XL","XVIII","XIV","XIII","X","VIII","V","IV","X", "IX"];

	var getNextToken = function(s, pos) {
		for (i=0; i<_invalid.length; i++) {
			if ( s.indexOf(_invalid[i], pos) == pos ) {
				throw "Número inválido";
			}
		}
		for (i=0; i<_tokens.length; i++) {
			if ( s.indexOf(_tokens[i], pos) == pos ) {
				return i;
			}
		}
		throw "invalid token at - " + pos;
	};

	var makeArabic = function() {
		var value = $("#romano").val().toUpperCase();

		for (var i=0; i<value.length; i++){
			if($.inArray(value[i], digits) == -1){
				$("#result2").html("Caracter inválido encontrado");
				return;
			}
		}
		
		var rome = value.replace(/[^IVXLCDM]/g, "");
		try {
			if ( rome.length == 0 ) {
				throw "";
			}
					
			var pos = 0;
			var val = 0;
			var t1 = -1;

			while ( pos < rome.length ) {
				var t = getNextToken(rome, pos);
				if ( t1 != -1 ) {
					if ( _valuesx[t1] < _valuesx[t] ) {
						throw "Número inválido";
					}
				}
				pos += _tokens[t].length;
				val += _valuesx[t];
				t1 = t;
			}
			$("#result2").html( rome + " = " + Number(val).toLocaleString('pt') );

		}
		catch (err) {
			$("#result2").html(err);
			return;
		}
	};

	$('#romano').keyup(function(){
		$('#romano').val($('#romano').val().toUpperCase());
		makeArabic();
	});

}
