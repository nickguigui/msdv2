<script>
function run(){
	var rate;
	var fromVal;
	var toVal;
	var changing = false;
	var currentSymbol = 'USD_BRL';
	
	function getRate(from,to,change){

		changing = change;

		$(document).ajaxStart(function(){
			$('#icon').removeClass('btn-change');
			$('#icon').addClass('btn-loading');
		});
		
		$(document).ajaxStop(function(){
			$('#icon').removeClass('btn-loading');
			$('#icon').addClass('btn-change');
		});

		currentSymbol = from+'_'+to;

		$.ajax({type:'get', url:'https://api.invertexto.com/v1/currency/'+currentSymbol+'?token=661|xqfbRfFda6qReBvlbBRhuX3hFw6DdQ1f', dataType:'json',
			success: function(j){
				rate = j[currentSymbol].price;
				$('#fromVal').val('1');
				$('#toVal').val(rate);

				var temp = parseFloat(rate).toFixed(4);
				$("#toVal").val(temp.replace('.', ','));

				if(change){
					var $from = document.getElementById('from');
					var $to = document.getElementById('to');
					var fromIndex = $from.selectedIndex;
					var toIndex = $to.selectedIndex;
					$from.msDropdown.selectedIndex = toIndex;
					$to.msDropdown.selectedIndex = fromIndex;
				}

				//symbol
				var symbol_from = $('select#from option:selected').attr('data-symbol');
				var symbol_to = $('select#to option:selected').attr('data-symbol');
				$('#symbol-from').text(symbol_from);
				$('#symbol-to').text(symbol_to);

				changing = false
				$('#error').hide();

			},error: function(e){
				$('#error').text(e.responseJSON.message).show();
			}
		});
	}

	$('select.countries').change(function(){
		var $from = document.getElementById('from');
		var $to = document.getElementById('to');

		var symbol = $from.value+'_'+$to.value;

		if(currentSymbol == symbol) return;
		if(changing) return;
		
		console.log('changed');
		getRate($from.value, $to.value, false);

		window.history.replaceState(null, null, '?from='+$from.value+'&to='+$to.value);
	});
		
	//first run
	getRate('USD','BRL', false);
	
	//change options
	$('#icon').on('click', function(){
		var from = $('select#to option:selected').val();
		var to = $('select#from option:selected').val();
		changing = true;
		getRate(from,to,true);

		window.history.replaceState(null, null, '?from='+from+'&to='+to);
	});

	//inputs
	function calcFormat(valor,cotacao){
		var result;
		valor = valor.replace(',', '.');
		if(valor.length != 0){
			var temp = parseFloat(valor)*parseFloat(cotacao);
			temp = temp.toFixed(4);
			result = temp.replace('.', ',');
		}else{
			result='';	
		}
		return result;
	}

	$('input#fromVal').keyup(function(){
		fromVal = $('#fromVal').val();
		var total = calcFormat(fromVal,rate);
		$('#toVal').val(total);	
	});
	
	$('input#toVal').keyup(function(){
		toVal = $('#toVal').val();
		var total = calcFormat(toVal,1/rate);
		$('#fromVal').val(total);
	});
}
</script>	</main>
