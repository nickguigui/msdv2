<script>
function run(){
	$('#gerar').click(function(){
		var estado = $('#estado').val();
		var pontuacao = $("#pontuacao").is(':checked');

		$(document).ajaxStart(function(){
			$('#gerar').attr('disabled', true);
		});

		$(document).ajaxStop(function(){
			$('#gerar').removeAttr('disabled');
		});

		$.ajax({
			type:'post', data:{estado:estado,pontuacao:pontuacao}, url:'ajax/gerar-cep.php', dataType:'json',
			success: function(j){
				$('#cep').val(j.cep);
				$('#endereco').val(j.endereco);
				$('#bairro').val(j.bairro);
				$('#cidade').val(j.cidade);
				$('#uf').val(j.uf);
			},
			error: function(j){
				console.log(j);
			}
		});
	});

	$('.box input[type=text]').click(function(){
		$(this).select();
	});
}
</script>	</main>
