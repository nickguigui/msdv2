	<h1>Leitura Rápida</h1>
	<div class="box">

		<div class="overlay overlay-light">
			<div class="palavras"></div>
		</div>

		<div class="menu">
			<textarea name="origem" class="form-control origem">Esta ferramenta exibe uma palavra de cada vez, em rápidas sucessões. Esse truque permite que você leia mais rápido. Copie um texto aqui e dê o play. Divirta-se!</textarea>
			<div class="form-inline" style="margin-top:15px">

				<button type="button" class="btn btn-classic" id="play"><i class="glyphicon glyphicon-play"></i> Ler Rápido</button>

					<div class="input-group">
						<div class="input-group-addon" title="Palavras Por Minuto">PPM</div>

					</div>
				</div>

				<div class="form-group">

						<select class="form-control input-size" id="cor">
							<option value="branco">Branco</option>
							<option value="preto">Preto</option>
						</select>
					</div>
				</div>

				<div class="form-group">
					<div class="input-group">
						<div class="input-group-addon" title="Tamanho da Fonte">Fonte</div>
						<input type="number" class="form-control input-size" id="fonte" value="42" min="12" max="100">
					</div>
				</div>

			</div>
		</div>

<script>
function run(){
	var timer;

	$('#cor').change(function(){
		cor = $('#cor').val();
		if(cor=='preto'){
			$('.overlay').removeClass('overlay-light');
			$('.overlay').addClass('overlay-dark');
		}else{
			$('.overlay').removeClass('overlay-dark');
			$('.overlay').addClass('overlay-light');
		}
	});

	$('#play').click(function(){

		$('.overlay').addClass('overlay-open');

		var texto = $('.origem').val().replace('\n', ' ');
		var palavras = texto.split(' ');
		var divPalavras = $('.palavras');
		var fonteSize = $('#fonte').val();
		var ppm = $('#ppm').val();
		var velocidade = (60/ppm) * 1000;

		divPalavras.text('');
		divPalavras.css('font-size',fonteSize+'px');

		// Mostra palavras
		var i=0;
		function increment(){
			if(i<palavras.length) {
				divPalavras.text(palavras[i]);
				i++;
			} else {
				clearInterval(timer);
				setTimeout(function(){
					$('.overlay').click();
				},400);
			}
		}

		setTimeout(function(){
			timer = setInterval(function(){
				increment();
			},velocidade);	
		},400);
	});

	// Fechar tela
	$('.overlay').click(function(){
		setTimeout(function(){
			clearInterval(timer);
		},500);
		$('.overlay').removeClass('overlay-open');
	});
}
</script>	</main>
