<script>
function run() {

    // const colors = ['#95A5A6','#364C62','#9575CD','#E67E22','#E74C3C','#2196F3'];
    const colors = ['#7dd3fc','#fda4af','#d8b4fe','#93c5fd','#fcd34d','#86efac'];
    var tick = new Audio('sounds/tick.mp3');
    tick.load();

    function wheel(){

        const text = $('#text').val();
        const values = text.trim().split('\n');
        const unique = [...new Set(values)];

        let i = 0;
        const items = [];
        values.forEach(function(value,index){
            if(value.trim().length == 0) return;

            if(colors[i % unique.length] == undefined) i = 0;
            const color = colors[i % unique.length];

            items.push({
                text: value,
                message: '',
                background: color,
                value: 0,
            });

            i++;
        });

        $('.wheel').superWheel({
            slices: items,

            text: {
                color: '#333',
                size : 14,
                offset: 8,
                letterSpacing: 0,
                orientation: 'v',
                arc: true
            },

            slice: {
                background: "#333",
            },

            line: {
                width: 4,
                color: "#fefefe",
            },

            outer: {
                width: 6,
                color: "#fefefe",
            },

            inner: {
                width: 6,
                color: "#fefefe",
            },

            center: {
                width: 16,
            },

            width: 400,
            duration: 8000,
        });

        $('.wheel').superWheel('onStart', function(results) {
            $('.spin-to-win').text('Girando...');
        });

        $('.wheel').superWheel('onStep', function(results) {
            if (typeof tick.currentTime !== 'undefined')
                tick.currentTime = 0;
            tick.play();
        });

        $('.wheel').superWheel('onComplete', function(results) {
            $('.spin-to-win:disabled').prop('disabled', false).text('Girar');
        });
    }

    $(document).on('click', '.spin-to-win', function(e) {
        e.preventDefault();
        if($('#text').val().trim().length == 0) return alert('Nenhum valor informado.');
        $('.wheel').superWheel('start', 0);
        $(this).prop('disabled', true);
    });

    $('#text').on('input', function(e) {
        wheel();
    })

    wheel();

    // Buttons
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    $('#order').click(function(){
        var text = $('#text').val();
		var lines = text.trim().split('\n');

		lines.sort(function(a,b){
			return a.localeCompare(b);
		});

		$('#text').val(lines.join('\n'));
        wheel();
    });

    $('#random').click(function(){
        var text = $('#text').val();
		var lines = text.trim().split('\n');
        
        shuffleArray(lines);
        $('#text').val(lines.join('\n'));
        wheel();
    });

    $('#clear').click(function(){
        $('#text').val('').focus();
        wheel();
    });
}
</script>	</main>
