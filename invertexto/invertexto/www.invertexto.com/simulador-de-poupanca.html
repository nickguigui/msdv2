<script>
function run(){

	$('.numerico').number(true, 2, ',', '.');

	$('.block input').keydown(function(event){
		if(event.keyCode == 13)
			$('#calcular').click();
	});

	$('#calcular').click(function() {

		var valor = $('#valor').val();
		var aporte = $('#aporte').val();
		var prazo = $('#prazo').val();
		var juros = $('#juros').val();

		$(document).ajaxStart(function(){
			$("#calcular").attr('disabled', true);
		});
	
		$(document).ajaxStop(function(){
			$("#calcular").removeAttr('disabled');
		});

		$.ajax({
			type:'post',
			data: {valor:valor,aporte:aporte,prazo:prazo,juros:juros},
			url:'ajax/simulador-de-poupanca.php',
			dataType:'json',
			success: function(j){

				$('tbody').html('');
				$('.alert-danger').hide();

				if(j.status=='OK'){

					$('#totalPoupado').text('R$ '+j.totalPoupado);
					$('#totalJuros').text('R$ '+j.totalJuros);
					$('#totalAcumulado').text('R$ '+j.totalAcumulado);

					for(var i = 0; i < j.table.length; i++) {
						var obj = j.table[i];
						var row = '<tr>';
						row += '<td>'+obj.mes+'</td>';
						row += '<td>'+obj.poupado+'</td>';
						row += '<td>'+obj.juros_mes+'</td>';
						row += '<td>'+obj.juros_total+'</td>';
						row += '<td>'+obj.acumulado+'</td>';
						row += '</tr>';
						$('tbody').append(row);
					}

					$('.result-block').show();

				}else{
					$('.alert-danger').text(j.status);
					$('.alert-danger').show();
				}
			}
		});
	});
}
