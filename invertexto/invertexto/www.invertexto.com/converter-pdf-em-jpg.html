<script>
function run(){

	var thumbId=0;

	function generateThumbnail(url, id){

		pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';

		pdfjsLib.getDocument(url).then(function getPdfHelloWorld(pdf) {

			pdf.getPage(1).then(function getPageHelloWorld(page) {
				var vp = page.getViewport(1);
				var canvas = document.getElementById(id);
				canvas.width = 149;
				canvas.height = 212;
				var scale = Math.max(canvas.width / vp.width, canvas.height / vp.height);
				var viewport = page.getViewport(scale);

				var context = canvas.getContext('2d');

				var renderContext = {
					canvasContext: context,
					viewport: viewport
				};
				page.render(renderContext);
			});
		});
	}

	var hasError = false;
	var hasUploadError = false;

	Dropzone.autoDiscover = false;
	var myDropzone = new Dropzone('#previews', {
		autoProcessQueue: false,
		uploadMultiple: false,
		parallelUploads: 1,
		maxFiles: 1,
		paramName: "file",
		maxFilesize: 10,
		addRemoveLinks: false,
		clickable: true,
		timeout: 3600000,
		acceptedFiles: '.pdf',
		previewTemplate: '<div class="file" ><div data-dz-remove class="remove glyphicon glyphicon-remove" title="Remover"></div><canvas id="" width="149" height="212" data-dz-thumbnail></canvas><div class="file-info" data-dz-name></div></div>',
		dictDefaultMessage: '<i class="glyphicon glyphicon-download-alt drop"></i><p>Arraste os arquivos ou clique aqui.</p>',
		dictInvalidFileType: 'Tipo de arquivo não permitido.',
		dictMaxFilesExceeded: 'Limitado a 1 arquivo.',
		dictFileTooBig: 'Limitado a 5MB por arquivo.',
		init: function() {

			var porcentagem=0;

			this.on("sending", function(file) {
				$('#processar').text('ENVIANDO...');
				$('#processar').attr('disabled', true);
			});

			this.on("addedfile", function(file) {
				$('.controll-bar').show();

				file.previewTemplate.setAttribute('data-name',file.name);
				file.previewTemplate.childNodes[1].id = thumbId;
				thumbId++;

				var reader = new FileReader();
				reader.onload = function(event) {
					if(!file.accepted) return;
					var canvasId = file.previewTemplate.childNodes[1].id;
					generateThumbnail(event.target.result, canvasId);
				};
				reader.readAsDataURL(file);
			});

			this.on("maxfilesreached", function(file) {
				this.removeEventListeners();
			});

			this.on("removedfile", function(file) {
				var files = this.getAcceptedFiles();
				if(files.length==0) $('.controll-bar').hide();

				this.setupEventListeners();
			});

			this.on("totaluploadprogress", function(uploadProgress, totalBytes, totalBytesSent) {
				if(porcentagem>uploadProgress) return;
				if(totalBytesSent==0) return;

				porcentagem = Math.floor(uploadProgress);
				$('.progress-bar').css('width', porcentagem+'%');
				$('.progress-bar').attr('aria-valuenow', porcentagem);
			});

			this.on("success", function(file, response) {
				if(response!='OK'){
					if(!hasUploadError) alert(response);

					this.removeFile(file);
					hasUploadError = true;
					location.reload();
				}
			});

			this.on("queuecomplete", function() {
				if(hasError) return;
				if(this.getAcceptedFiles().length == 0) return;

				$('#processar').text('PROCESSANDO...');

				var files = $('.file').map(function() {
					return $(this).attr('data-name');
				}).get();

				$.ajax({type:'post', data:{files:JSON.stringify(files)}, url:'converter-pdf-em-jpg-process.php', dataType:'json',
					success: function(j){

						if(j.status=='OK'){
							window.location = '?download='+j.token;
						}else{
							alert(j.status);
							location.reload();
						}
					},
					error: function(xhr, status, error){
						console.log('Erro AJAX:', xhr.responseText);
						
						// Tentar parsear resposta JSON
						try {
							var response = JSON.parse(xhr.responseText);
							alert(response.status || 'Erro ao processar arquivos.');
						} catch(e) {
							alert('Erro ao processar arquivos: ' + xhr.status + ' - ' + error);
						}
						
						location.reload();
					}
				});
			});

			this.on("error", function(file, errorMessage) {
				if(errorMessage!='0'){
					this.removeFile(file);
					alert(errorMessage);
					hasError = true;
					return;
				}
				hasError = false;
			});
  		}
	});

	$('#processar').click(function(){
		hasError = false;
		myDropzone.processQueue();
	});
}
