			<div id="timer">00:00:000</div>

			<button id="toggle" class="btn btn-success" title="Barra de espaço">Iniciar</button>

<script>
function run(){
	var lap = 0;
	var lastLap;
	var timer = $('#timer');
	var watch = new Stopwatch();

	$('#toggle').click(function(){
		if(watch.isOn){
			// Stop pressed
			watch.stop();
			$('#toggle').text('Iniciar');
			$('#reset').text('Zerar');
			$('#toggle').removeClass('btn-danger');
			$('#toggle').addClass('btn-success');
		}else{
			// Start pressed
			lastLap = Date.now();
			watch.start();
			$('#toggle').text('Parar');
			$('#reset').text('Volta');
			$('#toggle').removeClass('btn-success');
			$('#toggle').addClass('btn-danger');
		}
	});

	$('#reset').click(function(){
		if(watch.isOn){

			lap++;
			var now = Date.now();
			lapTime = now - lastLap;
			lapFormatted = timeFormatter(lapTime);
			$('.laps').prepend('<tr><th>Volta '+lap+'</th><th>'+lapFormatted+'</th></tr>');

			lastLap = now;

		}else{
			watch.reset();

			lap = 0;
			$('.laps').empty();
		}
	});

	$(document).keydown(function(event) {
					
		if(event.keyCode=='32') {
			// Space bar
			event.preventDefault();
			$('#toggle').click();
			
		} else if(event.keyCode=='27'){
			// Esc
			event.preventDefault();
			$('#reset').click();
		}		
	});
}
</script>	</main>
