<script>
function run(){

    var result='';
    var editor = document.getElementById('editor');
    var dict = {a:"\u0363",e:"\u0364",i:"\u0365",o:"\u0366",u:"\u0367",c:"\u0368",d:"\u0369",h:"\u036A",m:"\u036B",r:"\u036C",t:"\u036D",v:"\u036E",x:"\u036F",b:"\u1DE8",f:"\u1DEB",g:"\u1DDA",G:"\u1DDB",k:"\u1DDC",l:"\u1DDD",L:"\u1DDE",M:"\u1DDF",n:"\u1DE0",N:"\u1DE1",p:"\u1DEE",R:"\u1DE2",s:"\u1DE4",w:"\u1DF1",z:"\u1DE6",".":"\u0307","ç":"\u1DD7"};

    function getTextSegments(element) {
        const textSegments = [];
        Array.from(element.childNodes).forEach((node) => {
            switch(node.nodeType) {
                case Node.TEXT_NODE:
                    textSegments.push({text: node.nodeValue, node});
                    break;
                    
                case Node.ELEMENT_NODE:
                    textSegments.splice(textSegments.length, 0, ...(getTextSegments(node)));
                    break;
                    
                default:
                    throw new Error(`Unexpected node type: ${node.nodeType}`);
            }
        });
        return textSegments;
    }

    function restoreSelection(absoluteAnchorIndex, absoluteFocusIndex) {
        const sel = window.getSelection();
        const textSegments = getTextSegments(editor);
        let anchorNode = editor;
        let anchorIndex = 0;
        let focusNode = editor;
        let focusIndex = 0;
        let currentIndex = 0;
        textSegments.forEach(({text, node}) => {
            const startIndexOfNode = currentIndex;
            const endIndexOfNode = startIndexOfNode + text.length;
            if (startIndexOfNode <= absoluteAnchorIndex && absoluteAnchorIndex <= endIndexOfNode) {
                anchorNode = node;
                anchorIndex = absoluteAnchorIndex - startIndexOfNode;
            }
            if (startIndexOfNode <= absoluteFocusIndex && absoluteFocusIndex <= endIndexOfNode) {
                focusNode = node;
                focusIndex = absoluteFocusIndex - startIndexOfNode;
            }
            currentIndex += text.length;
        });
        
        sel.setBaseAndExtent(anchorNode,anchorIndex,focusNode,focusIndex);
    }

    function getCaretPosition(editableDiv) {
        var caretPos = 0,
            sel, range;
        if (window.getSelection) {
            sel = window.getSelection();
            if (sel.rangeCount) {
            range = sel.getRangeAt(0);
            if (range.commonAncestorContainer.parentNode == editableDiv) {
                caretPos = range.endOffset;
            }
            }
        } else if (document.selection && document.selection.createRange) {
            console.log('aquiiii')
            range = document.selection.createRange();
            if (range.parentElement() == editableDiv) {
            var tempEl = document.createElement("span");
            editableDiv.insertBefore(tempEl, editableDiv.firstChild);
            var tempRange = range.duplicate();
            tempRange.moveToElementText(tempEl);
            tempRange.setEndPoint("EndToEnd", range);
            caretPos = tempRange.text.length;
            }
        }
        return caretPos;
    }

    function clean(str){
        return str.normalize('NFD').replace(/[\u0300-\u036f]/, '')
    }

    $('.add').click(function(){
        const sel = window.getSelection();
        const textSegments = getTextSegments(editor);
        const textContent = textSegments.map(({text}) => text).join('');
        let anchorIndex = null;
        let focusIndex = null;
        let currentIndex = 0;
        textSegments.forEach(({text, node}) => {
            if (node === sel.anchorNode) {
                anchorIndex = currentIndex + sel.anchorOffset;
            }
            if (node === sel.focusNode) {
                focusIndex = currentIndex + sel.focusOffset;
            }
            currentIndex += text.length;
        });

        var str = editor.innerText;
        var position = getCaretPosition(editor);
        var char = $(this).text();

        result='';
        console.log(position)
        console.log(str.length)
        
        for(var i=0; i<str.length; i++){
            
            if(i==position-1){
                result += str[i] + dict[char]
            }else{
                result += str[i]
            }
        }
        
        editor.innerText = result;
        restoreSelection(anchorIndex, focusIndex)
    });

    $('#original').keyup(function(){
        $('#resultado').text($(this).val());
    });

    // Tooltip
	$('.card').tooltip({
		trigger: 'manual',
		placement: 'bottom'
	});

	function setTooltip(btn, message) {
		btn.attr('data-original-title', message)
		.tooltip('show');
	}

	function hideTooltip(btn) {
		setTimeout(function() {
			btn.tooltip('hide');
		}, 1000);
	}

	// Clipboard
	var clipboard = new ClipboardJS('.card');
	clipboard.on('success', function(e) {
		var btn = $(e.trigger);
		setTooltip(btn, 'Copiado');
		hideTooltip(btn);
		e.clearSelection();
	});

    // Paste text
    document.querySelector('div[contenteditable="true"]').addEventListener("paste", function(e) {
        e.preventDefault();
        var text = e.clipboardData.getData("text/plain");
        document.execCommand("inserttext", false, text);
    });
}
