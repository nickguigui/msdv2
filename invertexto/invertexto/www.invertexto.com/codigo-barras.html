<div class="container">
	<h1>Gerador de Código de Barras</h1>
	<div class="box">
		<div class="row">
			<div class="col-sm-8">
				<div class="form-group">
					<label for="tipo">Tipo:</label>
					<select name="tipo" class="form-control" id="tipo">
						<option value="codabar">Codabar</option>
						<option value="code11">Code 11</option>
						<option value="code39" selected>Code 39</option>
						<option value="code39extended">Code 39 Extended</option>
						<option value="code93">Code 93</option>
						<option value="code128">Code 128</option>
						<option value="ean8">EAN-8</option>
						<option value="ean13">EAN-13</option>
						<option value="gs1128">GS1-128 (EAN-128)</option>
						<option value="i25">Interleaved 2 of 5</option>
						<option value="isbn">ISBN-10 / ISBN-13</option>
						<option value="msi">MSI Plessey</option>
						<option value="postnet">PostNet</option>
						<option value="s25">Standard 2 of 5</option>
						<option value="upca">UPC-A</option>
						<option value="upce">UPC-E</option>
						<option value="upcext2">UPC Extension 2 Digits</option>
						<option value="upcext5">UPC Extension 5 Digits</option>
					</select>
				</div>
				<div class="form-group">
					<label for="tamanho">Tamanho:</label>
					<select name="tamanho" class="form-control" id="tamanho">
						<option value="1">1</option>
						<option value="2" selected>2</option>
						<option value="3">3</option>
						<option value="4">4</option>
						<option value="5">5</option>
						<option value="6">6</option>
						<option value="7">7</option>
						<option value="8">8</option>
						<option value="9">9</option>
					</select>
				</div>
				<div class="form-group">
					<label for="rotate">Rotação:</label>
					<select name="rotate" class="form-control" id="rotate">
						<option selected value="0">0°</option>
						<option value="90">90°</option>
						<option value="180">180°</option>
						<option value="270">270°</option>
					</select>
				</div>
				<div class="form-group form-inline">
					<label for="font">Fonte:</label><br>
					<select name="font" class="form-control" id="font">
						<option selected value="arial">Arial</option>
						<option value="0">Sem Texto</option>
					</select>
					<input type="text" id="fontsize" class="form-control fontsize" value="11" />
				</div>
				<div class="form-group">
					<label for="altura">Altura:</label>
					<input type="text" name="altura" class="form-control" id="altura" value="30" />
				</div>
				<div class="form-group">
					<label for="codigo">Código:</label>
					<input type="text" name="text" class="form-control" id="codigo" value="" autocomplete="off" required />
				</div>
				<button type="button" class="btn btn-classic" id="gerar">Gerar Imagem</button>
			</div>
			<div class="col-sm-14 col-sm-offset-2">
				<div class="visible-xs space"></div>
				<div class="legenda">Resultado:</div>
				<div class="form-control result" id="resultado"></div>
			</div>
		</div>

<script>
function run(){
	$('#gerar').click(function(){
		const d = {
			type: $('#tipo').val(),
			scale: $('#tamanho').val(),
			thickness: $('#altura').val(),
			rotation: $('#rotate').val(),
			font: $('#font').val(),
			fontsize: $('#fontsize').val(),
			text: $('#codigo').val()
		}

		const url = 'https://api.invertexto.com/v1/barcode?token=1|wJaGozQy11RhSqQhunQ13XHD2OeVgsH8&text='+encodeURIComponent(d.text)+'&type='+d.type+'&font='+d.font+'&font_size='+d.fontsize+'&thickness='+d.thickness+'&scale='+d.scale+'&rotation='+d.rotation

		$('#resultado').html('<a href="'+url+'&download=true" title="Clique para baixar"><img src="'+url+'" class="img-responsive"></a>');
	})
}
</script>	</main>
