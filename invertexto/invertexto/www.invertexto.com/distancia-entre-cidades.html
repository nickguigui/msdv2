<div class="func-wrap container">
	<h1>Distância Entre Cidades</h1>

	<div class="box">
		<div style="margin:0 auto;width:300px">
			<div>
				<label for="from">Origem</label>
                <div id="from"></div>
			</div>
			<div style="margin-top:20px">
				<label for="to">Destino</label>
                <div id="to"></div>
            </div>
			<button type="submit" class="btn btn-classic btn-block" style="margin-top:30px" id="calcular">Calcular</button>
        </div>
		
	</div>

	<div class="resultado" id="output" style="display:none">
		<div class='alert alert-info'>
			Distância por estrada: <b>carregando...</b><br/>
			Duração: <b>carregando...</b>
		</div>
	</div>

	<div class="mapa"></div>
</div>

<script>
function run(){
    var lat;
    var lng;
    var coordinates1 = '';
    var coordinates2 = '';

    mapboxgl.accessToken = 'pk.eyJ1IjoiaW52ZXJ0ZXh0byIsImEiOiJjbGVvdzJ5YnAwNmtrM3NxdTU3bnFsbjZnIn0.vQEjlLblHR2tejZiTkpr2A';

    var geocoder1 = new MapboxGeocoder({
        accessToken: mapboxgl.accessToken,
        types: 'country,region,place,postcode,locality,neighborhood'
    });

    var geocoder2 = new MapboxGeocoder({
        accessToken: mapboxgl.accessToken,
        types: 'country,region,place,postcode,locality,neighborhood'
    });

    geocoder1.addTo('#from');
    geocoder2.addTo('#to');

    geocoder1.on('result', function(ev) {
        lat = ev.result.center[0];
        lng = ev.result.center[1];
        coordinates1 = ev.result.center[0]+','+ev.result.center[1];
    });

    geocoder2.on('result', function(ev) {
        coordinates2 = ev.result.center[0]+','+ev.result.center[1];
    });

    function fancyTimeFormat(duration) {   
        var hrs = ~~(duration / 3600);
        var mins = ~~((duration % 3600) / 60);
        var secs = ~~duration % 60;

        var result = "";

        if (hrs > 0) {
            var hString = hrs > 1 ? 'horas' : 'hora';
            result += hrs + ' ' + hString + ' ';
        }

        result += mins + ' minutos ';
        result += secs + ' segundos';
        return result;
    }

    function loadMap(geometry) {
        $('.mapa').html('<div id="map"></div>');

        var map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/streets-v12',
                center: [lat,lng],
                zoom: 2
            });

        map.on('load', function() {
            // check if the route is already loaded
            if (map.getSource('route')) {
                map.removeLayer('route');
                map.removeSource('route');
            } else{
                map.addLayer({
                    'id': 'route',
                    'type': 'line',
                    'source': {
                        'type': 'geojson',
                        'data': {
                            'type': 'Feature',
                            'properties': {},
                            'geometry': geometry
                        }
                    },
                    'layout': {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    'paint': {
                        'line-color': '#1db7dd',
                        'line-width': 8,
                        'line-opacity': 0.8
                    }
                });
            }

            var bounds = geometry.coordinates.reduce(function(bounds, coord) {
                return bounds.extend(coord);
            }, new mapboxgl.LngLatBounds(geometry.coordinates[0], geometry.coordinates[0]));

            map.fitBounds(bounds, {
                padding: 20
            });
        });
    }

    $('#calcular').click(function(){
        $('#output').show();
        var coordinates = coordinates1+';'+coordinates2;

        var url = 'https://api.mapbox.com/directions/v5/mapbox/driving/' + coordinates
            +'?geometries=geojson&steps=true&access_token=' + mapboxgl.accessToken;
        console.log(url)

        $(document).ajaxStart(function(){
            $('#calcular').attr('disabled', true);
        });

        $(document).ajaxStop(function(){
            $('#calcular').attr('disabled', false);
        });

        $.ajax({type:'get', url:url, dataType:'json',
            success: function(data){
                
                var distance = data.routes[0].distance / 1000;
                var duration = fancyTimeFormat(data.routes[0].duration);
                
                $('#output').html('<div class="alert alert-info">Distância por estrada: <b>'+distance.toFixed(2).toLocaleString()+' km</b><br/>Duração: <b>' +duration+'</b></div>'); 

                loadMap(data.routes[0].geometry);
            }
	    });
    });
}
</script>
