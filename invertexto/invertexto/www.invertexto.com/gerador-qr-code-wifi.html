<script>
function run(){
    $('#generate').click(function(){
        const network = $('#wifi-network').val();
        const password = $('#wifi-password').val();
        const qrcodeKey = 'WIFI:T:WPA;S:'+network+';P:'+password+';;';

        if(network.length == 0){
            return alert('O campo rede é obrigatório.');
        }

        $('#qrcode').html('<img src="https://api.invertexto.com/v1/qrcode?token=1|wJaGozQy11RhSqQhunQ13XHD2OeVgsH8&text='+encodeURIComponent(qrcodeKey)+'&scale=12" class="paper-effect"><a href="https://api.invertexto.com/v1/qrcode?token=1|wJaGozQy11RhSqQhunQ13XHD2OeVgsH8&text='+encodeURIComponent(qrcodeKey)+'&scale=12&download=true" class="btn">Baixar QR Code</a>');

        $('#placa').attr('href', 'gerador-qr-code-wifi-placa08e2.html?key='+encodeURIComponent(qrcodeKey));

        $('.result').show();
    })
}
</script>	</main>
