<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap');
.wrapper{display:flex;width:100%;gap:10px;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif}
.wrapper *{margin:0;padding:0}
.wrapper label{font-weight:normal}
.wrapper input{margin:0}
section{background:#fff;border-radius:7px}
.tools-board{width:210px;padding:15px 22px 0;user-select:none}
.tools-board .row{margin-bottom:20px}
.row .options{list-style:none;margin:10px 0 0 5px}
.row .options .option{display:flex;cursor:pointer;align-items:center;margin-bottom:10px}
.option:is(:hover, .active) img{filter:invert(17%) sepia(90%) saturate(3000%) hue-rotate(900deg) brightness(100%) contrast(100%)}
.option :where(span, label){color:#5A6168;cursor:pointer;padding-left:10px}
.option:is(:hover, .active) :where(span, label){color:#4A98F7}
.option #fill-color{cursor:pointer;height:14px;width:14px}
#fill-color:checked ~ label{color:#4A98F7}
.option #size-slider{width:100%;height:5px;margin-top:10px}
.colors .options{display:flex;justify-content:space-between}
.colors .option{height:20px;width:20px;border-radius:50%;margin-top:3px;position:relative}
.colors .option:nth-child(1){background-color:#fff;border:1px solid #bfbfbf}
.colors .option:nth-child(2){background-color:#000}
.colors .option:nth-child(3){background-color:#E02020}
.colors .option:nth-child(4){background-color:#6DD400}
.colors .option:nth-child(5){background-color:#4A98F7}
.colors .option.selected::before{position:absolute;content:"";top:50%;left:50%;height:12px;width:12px;background:inherit;border-radius:inherit;border:2px solid #fff;transform:translate(-50%, -50%)}
.colors .option:first-child.selected::before{border-color:#ccc}
.option #color-picker{opacity:0;cursor:pointer}
.buttons button{width:100%;color:#fff;border:none;outline:none;padding:11px 0;font-size:0.9rem;margin-bottom:13px;background:none;border-radius:4px;cursor:pointer}
.buttons .clear-canvas{color:#6C757D;border:1px solid #6C757D;transition:all 0.3s ease}
.clear-canvas:hover{color:#fff;background:#6C757D}
.buttons .save-img{background:#4A98F7;border:1px solid #4A98F7}
.drawing-board{flex:1;overflow:hidden;height:580px}
.drawing-board canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

@media (max-width: 767px) {
  .wrapper{flex-direction:column}
  .tools-board{width:100%;order:2}
  .drawing-board{width:100%;height:400px;order:1}
  .drawing-board canvas{width:100%;height:400px;display:block;cursor:crosshair}
}
</style>

<div class="container">
  <h1>Desenhar Online</h1>
  <div class="wrapper">
    <section class="tools-board">
      <div class="row">
        <label class="title">Formas</label>
        <ul class="options">
          <li class="option tool" id="rectangle">
            <img src="img/icons/rectangle.svg" alt="">
            <span>Retângulo</span>
          </li>
          <li class="option tool" id="circle">
            <img src="img/icons/circle.svg" alt="">
            <span>Círculo</span>
          </li>
          <li class="option tool" id="triangle">
            <img src="img/icons/triangle.svg" alt="">
            <span>Triângulo</span>
          </li>
          <li class="option">
            <input type="checkbox" id="fill-color">
            <label for="fill-color">Preencher cor</label>
          </li>
        </ul>
      </div>
      <div class="row">
        <label class="title">Opções</label>
        <ul class="options">
          <li class="option active tool" id="brush">
            <img src="img/icons/brush.svg" alt="">
            <span>Pincel</span>
          </li>
          <li class="option tool" id="eraser">
            <img src="img/icons/eraser.svg" alt="">
            <span>Apagador</span>
          </li>
          <li class="option">
            <input type="range" id="size-slider" min="1" max="30" value="5">
          </li>
        </ul>
      </div>
      <div class="row colors">
        <label class="title">Cores</label>
        <ul class="options">
          <li class="option"></li>
          <li class="option selected"></li>
          <li class="option"></li>
          <li class="option"></li>
          <li class="option">
            <input type="color" id="color-picker" value="#4A98F7">
          </li>
        </ul>
      </div>
      <div class="row buttons">
        <button class="clear-canvas">Limpar Tela</button>
        <button class="save-img">Salvar Imagem</button>
      </div>
    </section>
    <section class="drawing-board">
      <canvas></canvas>
    </section>
  </div>
