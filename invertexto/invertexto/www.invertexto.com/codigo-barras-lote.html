<script>
function run(){
	var LS_PREFIX = 'barcode_lote_';
	var LS_FIELDS = ['tipo', 'rotate', 'font', 'fontsize', 'altura', 'tamanho', 'margem'];

	function loadFromStorage() {
		LS_FIELDS.forEach(function(field) {
			var val = localStorage.getItem(LS_PREFIX + field);
			if (val !== null) {
				$('[name="' + field + '"]').val(val);
			}
		});
	}

	$(document).ready(function() {
		loadFromStorage();

		LS_FIELDS.forEach(function(field) {
			$('[name="' + field + '"]').on('change input', function() {
				localStorage.setItem(LS_PREFIX + field, $(this).val());
			});
		});
	});

	$('#random').click(function(){
		var primeiro = $('#primeiro').val();
		var ultimo = $('#ultimo').val();
		var prefixo = $('#prefixo').val();
		var sufixo = $('#sufixo').val();

		primeiro = parseInt(primeiro);
		ultimo = parseInt(ultimo);

		var temp = primeiro;
		var diff = ultimo - primeiro;
		var result = '';

		for(var i=0; i<=diff; i++) {
			result += prefixo+temp+sufixo+"\n";
			temp = temp+1;
		}

		$('#codigos').val(result.trim());
		$('#gerador-numeros').modal('hide');
	});
}
