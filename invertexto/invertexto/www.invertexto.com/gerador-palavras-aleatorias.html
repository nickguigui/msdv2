<div class="container" id="tool">
	<h1>Gerador de Palavras Aleatórias</h1>
	
	<div class="grid grid-cols-12 gap-4 lg:gap-8">
		<div class="card col-span-full md:col-span-6 lg:col-span-4">
            <div class="form-group">
				<label for="type">Tipo</label>
				<select id="type" class="form-control" style="width:auto">
                    <option value="">Todas as Palavras</option>
                    <option value="animal">Animais</option>
                    <option value="corpo">Corpo Humano</option>
                    <option value="profissao">Profissões</option>
                    <option value="fruta">Frutas</option>
                </select>
			</div>
			<div class="form-group">
				<label for="num_words">Palavras</label>
				<input type="number" min="1" max="10" class="form-control w-24" id="num_words" autocomplete="off" value="5">
			</div>
			<div class="form-group">
				<label for="num_letters">Quantidade de letras</label>
				<input type="number" min="1" max="20" class="form-control w-24" id="num_letters" autocomplete="off">
			</div>
			<div class="form-group">
				<label for="starts_with">Começa com</label>
				<input type="text" class="form-control w-24" id="starts_with">
			</div>
            <div class="form-group">
				<label for="ends_with">Termina com</label>
				<input type="text" class="form-control w-24" id="ends_with">
			</div>
			<button type="button" class="btn btn-classic" style="margin-top:16px" id="generate">Gerar Palavras</button>
		</div>

		<div class="card col-span-full md:col-span-6 lg:col-span-8 overflow-x-auto" style="display:flex;align-items:center;justify-content:center;position:relative;min-height:180px">
			<div style="color:#767676;margin-bottom:16px;position:absolute;top:16px;left:16px">RESULTADO</div>
<pre class="data" id="result"></pre>
		</div>
	</div>
</div>

<script>
function run(){
	$('#generate').click(function(){

		var form = {
			type:$('#type').val(),
			num_words:$('#num_words').val(),
			num_letters:$('#num_letters').val(),
			starts_with:$('#starts_with').val(),
			ends_with:$('#ends_with').val(),
		};

		$(document).ajaxStart(function(){
			$('#generate').attr('disabled',true);
		});

		$(document).ajaxStop(function(){
			$('#generate').attr('disabled',false);
		});

		$.ajax({type:'post', data:form, url:'/ajax/words.php', dataType:'json',
			success:function(j){
                if(j.status == 'ok'){
                    let html = ''
                    for (item of j.result) {
                        html += item.word+'\n'
                    }
                    $('#result').html(html);
                    return;
                }
                $('#result').html('<span class="errormsg">'+j.status+'</span>'); 
			},
            error:function(e){
                $('#result').html('<span class="errormsg">Erro inesperado.</span>'); 
            }
		});
	});

    $('#tool input').keydown(function(e){
        if(e.keyCode == 13) $('#generate').click();
    });
}
</script>	</main>
