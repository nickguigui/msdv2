<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradutor da Minha Língua</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            background-color: #1e1e2e; 
            color: #cdd6f4; 
        }
        h1 { color: #89b4fa; text-align: center; }
        textarea { 
            width: 100%; 
            height: 100px; 
            padding: 15px; 
            font-size: 16px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            border: none; 
            background-color: #313244; 
            color: #cdd6f4; 
            box-sizing: border-box;
        }
        .botoes { display: flex; gap: 10px; }
        button { 
            flex: 1;
            background-color: #89b4fa; 
            color: #1e1e2e; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        button:hover { background-color: #b4befe; }
        .btn-baixar { background-color: #a6e3a1; }
        .btn-baixar:hover { background-color: #94e2d5; }
        #resultado { 
            margin-top: 25px; 
            padding: 20px; 
            background: #313244; 
            border-radius: 8px; 
            min-height: 60px; 
            font-size: 20px; 
            font-weight: bold;
            text-align: center;
        }
        .aviso { 
            color: #f9e2af; 
            font-weight: bold; 
            margin-top: 15px; 
            font-size: 14px; 
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Tradutor da Minha Língua</h1>
    
    <textarea id="textoOrigem" placeholder="Digite sua frase em português..."></textarea>
    
    <div class="botoes">
        <button onclick="traduzir()">Traduzir</button>
        <button class="btn-baixar" onclick="baixarDicionario()">Baixar Dicionário</button>
    </div>

    <div id="resultado">A tradução aparecerá aqui...</div>
    <div id="avisos"></div>

    <script>
        // 1. Sílabas estilo Japonês
        const silabas = [
            'a', 'i', 'u', 'e', 'o', 'ka', 'ki', 'ku', 'ke', 'ko',
            'sa', 'shi', 'su', 'se', 'so', 'ta', 'chi', 'tsu', 'te', 'to',
            'na', 'ni', 'nu', 'ne', 'no', 'ha', 'hi', 'fu', 'he', 'ho',
            'ma', 'mi', 'mu', 'me', 'mo', 'ya', 'yu', 'yo',
            'ra', 'ri', 'ru', 're', 'ro', 'wa', 'n',
            'ga', 'gi', 'gu', 'ge', 'go', 'za', 'ji', 'zu', 'ze', 'zo',
            'ba', 'bi', 'bu', 'be', 'bo'
        ];

        // 2. Dicionário Base
        let dicionario = {
            'água': 'glu', 'ele': 'hei', 'dele': 'ri',
            'ela': 'hai', 'dela': 'ra', 'você': 'mux'
        };

        // 3. Tenta carregar as palavras salvas no navegador
        if (localStorage.getItem("dicionarioSalvo")) {
            dicionario = JSON.parse(localStorage.getItem("dicionarioSalvo"));
        }

        function escolherAleatorio(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function traduzir() {
            const texto = document.getElementById("textoOrigem").value.toLowerCase();
            if (!texto.trim()) return;

            // Separa as palavras e tira pontuações básicas
            const palavras = texto.replace(/[.,!?]/g, "").split(/\s+/);
            let traduzido = [];
            let novosAvisos = [];

            palavras.forEach(palavra => {
                if (dicionario[palavra]) {
                    traduzido.push(dicionario[palavra]);
                } else {
                    // Sorteia 2, 3 ou 4 sílabas
                    const quantidade = [2, 3, 4][Math.floor(Math.random() * 3)];
                    let palavraInventada = "";
                    for (let i = 0; i < quantidade; i++) {
                        palavraInventada += escolherAleatorio(silabas);
                    }
                    
                    // Salva a nova palavra
                    dicionario[palavra] = palavraInventada;
                    novosAvisos.push(`Nova palavra: '${palavra}' agora é '${palavraInventada}'`);
                    traduzido.push(palavraInventada);
                }
            });

            // Salva o dicionário atualizado na memória do navegador
            localStorage.setItem("dicionarioSalvo", JSON.stringify(dicionario));

            // Mostra o resultado na tela
            document.getElementById("resultado").innerText = traduzido.join(" ");
            
            // Mostra os avisos de palavras novas
            document.getElementById("avisos").innerHTML = novosAvisos.map(a => `<p class="aviso">${a}</p>`).join("");
        }

        function baixarDicionario() {
            // Cria um arquivo JSON com o dicionário atual e faz o download
            const data = JSON.stringify(dicionario, null, 2);
            const blob = new Blob([data], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "meu_dicionario.json";
            a.click();
        }
    </script>
</body>
</html>
